<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Sprint</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fcfcfb; --panel: #f3f2ef; --line: #e2e0da; --ink: #0b0b0b; --ink2: #52514e; --ink3: #8a8884;
    --accent: #2a78d6; --danger: #d03b3b; --good: #0ca30c;
    --s1: #2a78d6; --s2: #eb6834; --grid: #e2e0da;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1a19; --panel: #242423; --line: #383835; --ink: #f0efec; --ink2: #c3c2b7; --ink3: #8a8884;
            --accent: #3987e5; --s1: #3987e5; --s2: #d95926; --grid: #383835; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 -apple-system, "PingFang TC", sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: center; gap: 4px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); }
  header button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 12px; font: inherit; color: var(--ink2); cursor: pointer; }
  header button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  header .status { margin-left: auto; color: var(--ink3); font-size: 12px; }
  main { padding: 14px 16px 24px; }
  section.tab { display: none; } section.tab.on { display: block; }
  h2 { font-size: 14px; margin: 18px 0 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .muted { color: var(--ink3); font-size: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 14px; padding: 2px 8px; background: var(--bg); }
  .chip input { width: 44px; border: 0; background: transparent; color: var(--ink); font: inherit; text-align: right; }
  .chip .x { cursor: pointer; color: var(--ink3); }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
  input[type=number] { width: 64px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 5px; padding: 3px 9px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--ink2); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td input.actual { width: 52px; text-align: right; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .tile .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .l { font-size: 11px; color: var(--ink3); }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .chart h3 { font-size: 12px; margin: 0 0 4px; color: var(--ink2); }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--ink2); margin-bottom: 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  svg { width: 100%; height: auto; display: block; }
  svg text { font: 11px -apple-system, sans-serif; fill: var(--ink2); }
  .lists { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  textarea { width: 100%; min-height: 80px; resize: vertical; }
  .err { color: var(--danger); }
  .form { display: grid; grid-template-columns: 140px 1fr; gap: 6px 10px; align-items: center; max-width: 640px; }
  .inline-form { background: var(--bg); border: 1px dashed var(--line); border-radius: 6px; padding: 6px 8px; margin: 4px 0; }
  details summary { cursor: pointer; color: var(--ink2); }
</style>
</head>
<body>
<header>
  <button data-tab="sprint" class="on">本期 sprint</button>
  <button data-tab="review">回顧</button>
  <button data-tab="settings">設定</button>
  <span class="status" id="status"></span>
</header>
<main>
  <section class="tab on" id="tab-sprint"></section>
  <section class="tab" id="tab-review"></section>
  <section class="tab" id="tab-settings"></section>
</main>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmtH = secs => { if (!secs || secs < 60) return "–"; const m = Math.floor(secs / 60), h = Math.floor(m / 60); return h ? `${h}h${String(m % 60).padStart(2, "0")}m` : `${m}m`; };
const pts = v => v == null ? "–" : (Number.isInteger(v) ? String(v) : String(v));
let state = null, session = window.cubiSession || null, pendingSprint = null;

function status(msg, isError) { const el = $("#status"); el.textContent = msg; el.className = "status" + (isError ? " err" : ""); }

async function call(action, payload = {}) {
  if (session && !("session" in payload)) payload.session = session;
  status("…");
  const r = await window.webkit.messageHandlers.cubi.postMessage({ action, args: [JSON.stringify(payload)] });
  if (!r.ok) { status(r.err || "失敗", true); throw new Error(r.err || "failed"); }
  if (action === "review.export") { status("已匯出 " + r.out); return r.out; }
  const data = JSON.parse(r.out);
  if (data.error) { status(data.error, true); throw new Error(data.error); }
  status("");
  return data;
}
async function refresh(action = "panel.state", payload = {}) { state = await call(action, payload); render(); }

// ---------- rendering ----------
function render() {
  renderSprint(); renderReview(); renderSettings();
}

function renderSprint() {
  const el = $("#tab-sprint"), s = state.sprint, cfg = state.config;
  let html = "";
  if (state.session) {
    const b = state.session;
    html += `<div class="card"><div class="row"><b>這個 session</b><span class="muted">${esc(b.name)} · ${esc(b.cwd || "")}</span></div>
      <div class="row" style="margin-top:6px">綁定：
      ${b.keys.map(k => `<span class="chip"><a href="https://${esc(state.site)}/browse/${esc(k)}">${esc(k)}</a>
        <input type="number" min="0" max="100" value="${b.shares[k] ?? ""}" data-share="${esc(k)}" title="比例 %">%
        <span class="x" data-unbind="${esc(k)}" title="解除">✕</span></span>`).join("")}
      <input id="bind-key" placeholder="加單號" size="10"><button id="bind-btn">加</button>
      ${b.keys.length > 1 ? `<button id="shares-btn">套用比例到本 sprint</button>` : ""}
      <span class="muted">自動抓到：${esc(b.auto.join(" ") || "無")}；比例預設平分</span></div></div>`;
  }
  const options = state.sprints.map(x => `<option value="${esc(x.label)}" ${x.label === state.current ? "selected" : ""}>${esc(x.name || x.label)}</option>`).join("");
  html += `<div class="row"><select id="sprint-select">${options}<option value="__new">＋ 新 sprint…</option></select>`;
  if (s) html += `<input id="sp-name" value="${esc(s.name || "")}" size="12" title="名稱"><input id="sp-start" type="date" value="${esc(s.start || "")}">–<input id="sp-end" type="date" value="${esc(s.end || "")}">
    <input id="sp-goal" value="${esc(s.goal || "")}" placeholder="目標" size="24"><button id="sp-save">存</button><button id="sp-sync" class="primary">同步 Jira</button>`;
  html += `</div>`;
  if (pendingSprint) html += `<div class="inline-form row">標籤 <input id="new-label" placeholder="Sprint7" size="8"> 名稱 <input id="new-name" size="10"> <input id="new-start" type="date"> – <input id="new-end" type="date"> <button id="new-save" class="primary">建立</button><button id="new-cancel">取消</button></div>`;
  if (!s) { el.innerHTML = html + `<p class="muted">還沒有 sprint。建一個，標籤要跟 Jira 上的標籤一樣（例如 Sprint7），「同步 Jira」就會把那個標籤的單抓進來。</p>`; bindSprint(); return; }
  const m = s.metrics;
  html += `<table><thead><tr><th>單號</th><th>摘要</th><th>狀態</th><th class="num">估</th><th class="num">實</th><th class="num">時數</th><th></th></tr></thead><tbody>`;
  for (const t of s.tickets) {
    html += `<tr data-key="${esc(t.key)}"><td><a href="https://${esc(state.site)}/browse/${esc(t.key)}">${esc(t.key)} ↗</a></td>
      <td title="${esc(t.notes)}">${esc(t.summary)}</td><td>${esc(t.status)}${t.done ? " ✓" : ""}</td>
      <td class="num">${pts(t.estimate)}</td><td class="num"><input class="actual" type="number" step="0.5" min="0" value="${t.actual ?? ""}" data-actual="${esc(t.key)}"></td>
      <td class="num" title="session ${fmtH(t.sessionSeconds)}，手動 ${fmtH(t.manualSeconds)}">${fmtH(t.seconds)}</td>
      <td class="row"><button data-transition="${esc(t.key)}">狀態▾</button><button data-time="${esc(t.key)}">+時數</button>${cfg.actualPointsField ? `<button data-push="${esc(t.key)}">寫回</button>` : ""}</td></tr>`;
  }
  html += `</tbody></table>
    <div class="row" style="margin-top:8px"><span>合計 估 ${pts(m.estimate)} · 實際 ${pts(m.actual)} · 完成 ${m.done}/${m.tickets} · 時數 ${fmtH(m.seconds)}${m.meetingSeconds ? `（會議 ${fmtH(m.meetingSeconds)}）` : ""}</span>
    <input id="add-key" placeholder="加單號" size="10"><button id="add-btn">加</button></div>
    <div id="inline"></div>`;
  if (s.manual.length) {
    html += `<details><summary>手動時段 ${s.manual.length} 筆</summary><table>${s.manual.map(x => `<tr><td>${esc(x.key)}</td><td>${new Date(x.start * 1000).toLocaleString("zh-TW")}</td><td>${fmtH(x.end - x.start)}</td><td>${esc(x.kind)} ${esc(x.note)}</td><td>${x.calendar ? "📅" : ""}</td><td><button data-remove-time="${esc(x.id)}">刪</button></td></tr>`).join("")}</table></details>`;
  }
  el.innerHTML = html;
  bindSprint();
}

function bindSprint() {
  const el = $("#tab-sprint");
  $("#sprint-select", el)?.addEventListener("change", async e => {
    if (e.target.value === "__new") { pendingSprint = true; renderSprint(); return; }
    await refresh("sprint.select", { label: e.target.value });
  });
  $("#new-save", el)?.addEventListener("click", () => { pendingSprint = null; refresh("sprint.new", { label: $("#new-label").value.trim(), name: $("#new-name").value, start: $("#new-start").value, end: $("#new-end").value }); });
  $("#new-cancel", el)?.addEventListener("click", () => { pendingSprint = null; renderSprint(); });
  $("#sp-save", el)?.addEventListener("click", () => refresh("sprint.update", { name: $("#sp-name").value, start: $("#sp-start").value, end: $("#sp-end").value, goal: $("#sp-goal").value }));
  $("#sp-sync", el)?.addEventListener("click", () => refresh("sprint.sync"));
  $("#add-btn", el)?.addEventListener("click", () => refresh("ticket.add", { key: $("#add-key").value }));
  $("#bind-btn", el)?.addEventListener("click", () => refresh("session.bind", { key: $("#bind-key").value }));
  $("#shares-btn", el)?.addEventListener("click", () => refresh("session.shares", { shares: currentShares(), applyToSprint: true }));
  el.querySelectorAll("[data-share]").forEach(i => i.addEventListener("change", () => refresh("session.shares", { shares: currentShares() })));
  el.querySelectorAll("[data-unbind]").forEach(x => x.addEventListener("click", () => refresh("session.unbind", { key: x.dataset.unbind })));
  el.querySelectorAll("[data-actual]").forEach(i => i.addEventListener("change", () => refresh("ticket.update", { key: i.dataset.actual, actual: i.value })));
  el.querySelectorAll("[data-push]").forEach(b => b.addEventListener("click", () => refresh("points.push", { key: b.dataset.push })));
  el.querySelectorAll("[data-remove-time]").forEach(b => b.addEventListener("click", () => refresh("time.remove", { id: b.dataset.removeTime })));
  el.querySelectorAll("[data-time]").forEach(b => b.addEventListener("click", () => timeForm(b.dataset.time)));
  el.querySelectorAll("[data-transition]").forEach(b => b.addEventListener("click", () => transitionMenu(b.dataset.transition, b)));
}

function currentShares() { const o = {}; document.querySelectorAll("[data-share]").forEach(i => { o[i.dataset.share] = Number(i.value) || 0; }); return o; }

function timeForm(key) {
  const now = new Date(Date.now() - 3600 * 1000), local = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  $("#inline").innerHTML = `<div class="inline-form row">${esc(key)} 開始 <input id="t-start" type="datetime-local" value="${local}"> 長度 <input id="t-min" type="number" value="60" min="1"> 分
    <select id="t-kind"><option>開發</option><option>會議</option><option>討論</option><option>其他</option></select>
    <input id="t-note" placeholder="備註" size="16"> <label><input id="t-cal" type="checkbox" checked> 寫進行事曆</label>
    <button id="t-save" class="primary">加</button><button id="t-cancel">取消</button></div>`;
  $("#t-save").onclick = () => refresh("time.add", { key, start: $("#t-start").value, minutes: Number($("#t-min").value), kind: $("#t-kind").value, note: $("#t-note").value, calendar: $("#t-cal").checked });
  $("#t-cancel").onclick = () => { $("#inline").innerHTML = ""; };
}

async function transitionMenu(key, button) {
  const data = await call("ticket.transition", { key });
  const sel = document.createElement("select");
  sel.innerHTML = `<option value="">換狀態…</option>` + data.transitions.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");
  sel.onchange = () => { if (sel.value) refresh("ticket.transition", { key, id: sel.value }); };
  button.replaceWith(sel);
}

// ---------- review ----------
function renderReview() {
  const el = $("#tab-review"), s = state.sprint;
  if (!s) { el.innerHTML = `<p class="muted">還沒有 sprint。</p>`; return; }
  const m = s.metrics, r = s.review;
  const tile = (v, l) => `<div class="tile"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  let html = `<div class="row"><h2 style="margin:0">${esc(s.name || s.label)} 回顧 <span class="muted">${esc(s.start || "?")} – ${esc(s.end || "?")}</span></h2><span style="flex:1"></span><button id="export">匯出 Markdown</button></div>
    <div class="tiles" style="margin-top:10px">${tile(`${pts(m.donePoints)}/${pts(m.estimate)}`, "完成點數 / 估點")}${tile(`${m.done}/${m.tickets}`, "完成單數")}${tile(m.ratio ?? "–", "實際 / 估點")}${tile(m.hoursPerPoint ?? "–", "每點小時")}${tile(`${fmtH(m.meetingSeconds)} / ${fmtH(m.seconds)}`, "會議 / 總投入")}</div>
    <div class="charts" style="margin-top:12px">
      <div class="chart"><h3>估點 vs 實際（每張單）</h3><div class="legend"><span><i style="background:var(--s1)"></i>估點</span><span><i style="background:var(--s2)"></i>實際</span></div>${pairBars(s.tickets)}</div>
      <div class="chart"><h3>剩餘點數（burndown）</h3><div class="legend"><span><i style="background:var(--s1)"></i>理想</span><span><i style="background:var(--s2)"></i>實際</span></div>${burndownChart(s.burndown)}</div>
      <div class="chart"><h3>投入時數（每張單）</h3><div class="legend"><span><i style="background:var(--s1)"></i>開發</span><span><i style="background:var(--s2)"></i>會議／討論</span></div>${hourBars(s.tickets)}</div>
      <div class="chart"><h3>近幾個 sprint</h3><div class="legend"><span><i style="background:var(--s1)"></i>完成點數</span><span>數字＝實際/估點</span></div>${historyChart(state.history)}</div>
    </div>
    <div class="lists" style="margin-top:12px">
      <div><h2>做得好的地方</h2><textarea data-list="wentWell">${esc(r.wentWell.join("\n"))}</textarea></div>
      <div><h2>需要改善的地方</h2><textarea data-list="toImprove">${esc(r.toImprove.join("\n"))}</textarea></div>
      <div><h2>改善建議</h2><textarea data-list="suggestions">${esc(r.suggestions.join("\n"))}</textarea></div>
      <div><h2>想感謝的夥伴 <span class="muted">一行一位：名字：原因</span></h2><textarea data-list="thanks">${esc(r.thanks.map(t => `${t.who}：${t.why}`).join("\n"))}</textarea></div>
    </div><p class="muted">一行一條，離開欄位就存。</p>`;
  el.innerHTML = html;
  $("#export").onclick = () => call("review.export");
  el.querySelectorAll("[data-list]").forEach(t => t.addEventListener("change", () => {
    const lines = t.value.split("\n").map(x => x.trim()).filter(Boolean);
    const value = t.dataset.list === "thanks" ? lines.map(l => { const i = l.search(/[:：]/); return i < 0 ? { who: l, why: "" } : { who: l.slice(0, i).trim(), why: l.slice(i + 1).trim() }; }) : lines;
    refresh("review.update", { [t.dataset.list]: value });
  }));
}

// Charts: inline SVG, two series at most (blue = plan/dev, orange = actual/meeting), thin marks, labels in ink.
const W = 440;
function pairBars(rows) {
  const n = rows.length; if (!n) return `<p class="muted">沒有單</p>`;
  const max = Math.max(1, ...rows.map(r => Math.max(r.estimate || 0, r.actual || 0))), rowH = 26, left = 76, h = n * rowH + 8;
  let g = "";
  rows.forEach((r, i) => {
    const y = i * rowH + 4, w1 = (r.estimate || 0) / max * (W - left - 40), w2 = (r.actual || 0) / max * (W - left - 40);
    g += `<text x="${left - 6}" y="${y + 15}" text-anchor="end">${esc(r.key)}</text>
      <rect x="${left}" y="${y + 2}" width="${w1}" height="8" rx="2" fill="var(--s1)"><title>${esc(r.key)} 估 ${pts(r.estimate)}</title></rect>
      <rect x="${left}" y="${y + 12}" width="${w2}" height="8" rx="2" fill="var(--s2)"><title>${esc(r.key)} 實 ${pts(r.actual)}</title></rect>
      <text x="${left + Math.max(w1, w2) + 6}" y="${y + 15}">${pts(r.estimate)} → ${pts(r.actual)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${h}">${g}</svg>`;
}
function hourBars(rows) {
  const n = rows.length; if (!n) return `<p class="muted">沒有單</p>`;
  const max = Math.max(1, ...rows.map(r => r.seconds)), rowH = 20, left = 76, h = n * rowH + 8;
  let g = "";
  rows.forEach((r, i) => {
    const y = i * rowH + 4, dev = (r.seconds - r.meetingSeconds) / max * (W - left - 60), mt = r.meetingSeconds / max * (W - left - 60);
    g += `<text x="${left - 6}" y="${y + 12}" text-anchor="end">${esc(r.key)}</text>
      <rect x="${left}" y="${y + 3}" width="${dev}" height="10" rx="2" fill="var(--s1)"><title>開發 ${fmtH(r.seconds - r.meetingSeconds)}</title></rect>
      <rect x="${left + dev + (mt ? 2 : 0)}" y="${y + 3}" width="${mt}" height="10" rx="2" fill="var(--s2)"><title>會議 ${fmtH(r.meetingSeconds)}</title></rect>
      <text x="${left + dev + mt + 6}" y="${y + 12}">${fmtH(r.seconds)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${h}">${g}</svg>`;
}
function burndownChart(b) {
  if (!b.length) return `<p class="muted">sprint 要有起訖日期</p>`;
  const H = 150, left = 30, bottom = 20, top = 8, max = Math.max(1, b[0].ideal, ...b.map(p => p.actual || 0));
  const x = i => left + i / Math.max(1, b.length - 1) * (W - left - 10), y = v => top + (1 - v / max) * (H - top - bottom);
  const ideal = b.map((p, i) => `${x(i)},${y(p.ideal)}`).join(" ");
  const actualPts = b.filter(p => p.actual != null);
  const actual = actualPts.map((p) => `${x(b.indexOf(p))},${y(p.actual)}`).join(" ");
  let g = `<line x1="${left}" y1="${y(0)}" x2="${W - 10}" y2="${y(0)}" stroke="var(--grid)"/><text x="${left - 4}" y="${y(max) + 4}" text-anchor="end">${max}</text><text x="${left - 4}" y="${y(0) + 4}" text-anchor="end">0</text>
    <polyline points="${ideal}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-dasharray="4 3"/>
    <polyline points="${actual}" fill="none" stroke="var(--s2)" stroke-width="2"/>`;
  actualPts.forEach(p => { g += `<circle cx="${x(b.indexOf(p))}" cy="${y(p.actual)}" r="3" fill="var(--s2)"><title>${p.date} 剩 ${p.actual}</title></circle>`; });
  g += `<text x="${left}" y="${H - 4}">${b[0].date.slice(5)}</text><text x="${W - 10}" y="${H - 4}" text-anchor="end">${b[b.length - 1].date.slice(5)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function historyChart(hist) {
  if (!hist.length) return `<p class="muted">還沒有別的 sprint</p>`;
  const H = 130, max = Math.max(1, ...hist.map(h => h.donePoints)), bw = Math.min(60, (W - 20) / hist.length - 10);
  let g = "";
  hist.forEach((h, i) => {
    const x = 10 + i * ((W - 20) / hist.length), bh = h.donePoints / max * 80, y = 100 - bh;
    g += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="2" fill="var(--s1)"><title>${esc(h.label)} 完成 ${pts(h.donePoints)} 點</title></rect>
      <text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle">${pts(h.donePoints)}</text>
      <text x="${x + bw / 2}" y="114" text-anchor="middle">${esc(h.label)}</text><text x="${x + bw / 2}" y="127" text-anchor="middle">${h.ratio ?? "–"}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

// ---------- settings ----------
function renderSettings() {
  const el = $("#tab-settings"), c = state.config;
  const field = (k, label, hint) => `<label for="c-${k}">${label}</label><div><input id="c-${k}" value="${esc(c[k] ?? "")}" style="width:100%">${hint ? `<div class="muted">${hint}</div>` : ""}</div>`;
  el.innerHTML = `<div class="form">
    ${field("site", "Jira 站台", "例如 example.atlassian.net")}
    ${field("netrc", "netrc 路徑", `帳號與 API token 放這裡（machine &lt;站台&gt; login &lt;email&gt; password &lt;token&gt;）；${state.netrcFound ? "<span style='color:var(--good)'>找到檔案</span>" : "<span class='err'>找不到檔案</span>"}`)}
    ${field("projectKey", "專案 key", "單號前綴，例如 PROJ")}
    ${field("jql", "同步用 JQL", "{project}、{label} 會代入；想只抓自己的加 AND assignee = currentUser()")}
    ${field("pointsField", "估點欄位 id", "Story point estimate 通常是 customfield_10016")}
    ${field("actualPointsField", "實際點數欄位 id", "留空就只存本機；填了表格才有「寫回」")}
    ${field("reviewDir", "回顧 Markdown 資料夾", "匯出到 <資料夾>/<sprint 標籤>.md")}
    <span></span><div><button id="c-save" class="primary">儲存</button></div></div>`;
  $("#c-save").onclick = () => { const p = {}; ["site", "netrc", "projectKey", "jql", "pointsField", "actualPointsField", "reviewDir"].forEach(k => { p[k] = $("#c-" + k).value; }); refresh("config.set", p); };
}

// ---------- boot ----------
document.querySelectorAll("header button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("header button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("on", s.id === "tab-" + b.dataset.tab));
}));
window.addEventListener("cubisession", () => { session = window.cubiSession || null; refresh(); });
refresh().catch(() => {});
</script>
</body>
