<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Sprint</title>
<style>
  /* Only what the cubi style kit (manifest panel.style: "cubi") does not already give. */
  .tight td { padding-top: 8px; padding-bottom: 8px; }
  .key { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; white-space: nowrap; }
  td input.actual { width: 64px; text-align: right; padding: 3px 6px; }
  /* Fixed columns: the summary takes what is left (cut with …), so the table never runs past its card. */
  .scroll-x { overflow-x: auto; }
  table.fixed .remain { min-width: 0; }
  table.fixed td select { width: 100%; }
  table.fixed { table-layout: fixed; }
  table.fixed td { overflow: hidden; white-space: nowrap; }
  table.fixed td.clip { max-width: none; text-overflow: ellipsis; }
  table.fixed .cubi-pill { max-width: 100%; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: middle; }
  th[data-sort] { cursor: pointer; user-select: none; }
  th[data-sort]:hover { color: var(--cubi-ink); }
  .star { background: none; border: 0; padding: 0; font-size: 15px; line-height: 1; cursor: pointer; color: var(--cubi-ink3); }
  .star.on { color: var(--cubi-warning); }
  .remain { display: flex; align-items: center; gap: 8px; min-width: 150px; }
  .remain .cubi-bar { flex: 1; }
  .remain span { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 58px; text-align: right; }
  .donut-wrap { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: center; }
  .donut-wrap svg { width: 150px; height: 150px; }
  .donut-wrap .cubi-split { grid-auto-flow: row; gap: 2px; }
  .donut-wrap .cubi-split > button { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-bottom: 0; border-left: 4px solid; border-radius: 6px; }
  .donut-wrap .cubi-split > button b { font-size: 15px; order: 2; }
  .chart svg { width: 100%; height: auto; display: block; }
  svg text { font: 11px -apple-system, sans-serif; fill: var(--cubi-ink3); }
  svg path.slice { cursor: pointer; stroke: var(--cubi-card); stroke-width: 2; }
  svg .slice.dim { opacity: .3; }
  .lists { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .lists textarea { min-height: 96px; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }
  .timer.long { color: var(--cubi-danger); }
</style>
</head>
<body>
<div class="cubi-app">
  <nav class="cubi-nav">
    <div class="cubi-brand" id="brand">Sprint</div>
    <button class="cubi-nav-item on" data-tab="overview"></button>
    <button class="cubi-nav-item" data-tab="review"></button>
    <button class="cubi-nav-item" data-tab="settings"></button>
  </nav>
  <main class="cubi-main">
    <section id="tab-overview"></section>
    <section id="tab-review" hidden></section>
    <section id="tab-settings" hidden></section>
  </main>
</div>
<div class="cubi-status" id="status"></div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const ic = (n, s) => (window.cubiIcon ? window.cubiIcon(n, s) : "");
const fmtH = secs => { if (!secs || Math.abs(secs) < 60) return "–"; const m = Math.floor(Math.abs(secs) / 60), h = Math.floor(m / 60); return h ? `${h}h${String(m % 60).padStart(2, "0")}m` : `${m}m`; };
const clock = secs => { const s = Math.max(0, Math.floor(secs)); return [s / 3600, s / 60 % 60, s % 60].map(v => String(Math.floor(v)).padStart(2, "0")).join(":"); };
const pts = v => v == null ? "–" : String(Math.round(v * 100) / 100);
const CAT_COLORS = ["var(--cubi-c2)", "var(--cubi-c4)", "var(--cubi-c1)", "var(--cubi-c3)", "var(--cubi-c5)"];
const TABS = { overview: ["dashboard", "總覽"], review: ["review", "回顧"], settings: ["settings", "設定"] };
let state = null, session = window.cubiSession || null;
let pendingSprint = false, selectedCategory = null, pendingTime = null, briefPoll = null;

function status(msg, isError) { const el = $("#status"); el.textContent = msg || ""; el.className = "cubi-status" + (isError ? " err" : ""); if (msg && !isError) setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 4000); }
const bridge = () => window.webkit.messageHandlers.cubi;

async function call(action, payload = {}) {
  if (session && !("session" in payload)) payload.session = session;
  status("…");
  const r = await bridge().postMessage({ action, args: [JSON.stringify(payload)] });
  if (!r.ok) { status(r.err || "失敗", true); throw new Error(r.err || "failed"); }
  if (action === "review.export") { status("已匯出 " + r.out); return r.out; }
  const data = JSON.parse(r.out);
  if (data.error) { status(data.error, true); throw new Error(data.error); }
  status("");
  return data;
}
// Never rejects: a failure is already on screen (status); the result says whether it worked.
// `sent`: the fields this call saves. On success their drafts go, unless typed over meanwhile.
// Actions run side by side, so replies can come back out of order. A plain read older than a reply
// already drawn is dropped; a write's reply always shows, since it carries what the write did.
// A failed send puts what was sent back as drafts (same sprint and session only), so a form that a
// re-render dropped can refill.
let asked = 0, drawn = 0;
async function refresh(action = "panel.state", payload = {}, sent = []) {
  sent = [...sent].map(draftOf).filter(Boolean);
  const n = ++asked, from = draftsFor;
  let data;
  try { data = await call(action, payload); } catch (_) {
    if (draftsFor === from) for (const [sel, d] of sent) if (!drafts.has(sel)) drafts.set(sel, d);
    return false;
  }
  if (action === "panel.state" && n < drawn) return true;
  drawn = Math.max(drawn, n);
  for (const [sel, d] of sent) if (drafts.get(sel)?.value === d.value) drafts.delete(sel);
  state = data;
  render();
  return true;
}
const link = key => `<a href="https://${esc(state.site)}/browse/${esc(key)}" title="在 Jira 開">${esc(key)}</a>`;
const tip = text => `<span class="cubi-tip" title="${esc(text)}">${ic("info", 13)}</span>`;

// ---------- render ----------
// What the user typed and has not saved lives in `drafts` (by field selector), noted as they type;
// a re-render draws the data and puts the drafts back on top. Drafts belong to one sprint and
// session, except the settings, which are global, and the field being typed in: that one is
// `carried` into the new sprint or session and never saved by itself until typed in again. The
// ＋時數 form keeps its own (pendingTime).
const fieldSel = a => a.id ? "#" + CSS.escape(a.id)
  : Object.keys(a.dataset).length ? `[data-${Object.keys(a.dataset)[0].replace(/[A-Z]/g, c => "-" + c.toLowerCase())}="${CSS.escape(Object.values(a.dataset)[0])}"]` : null;
const isBox = f => f.type === "checkbox";
const fieldValue = f => isBox(f) ? f.checked : f.value;
const isField = f => f?.matches?.("input, textarea, select");
const drafts = new Map(), carried = new Set();
let draftsFor = null, composing = false, renderLater = false;
function draftOf(f) {
  const sel = isField(f) && !f.closest("[data-time-form]") && fieldSel(f);
  return sel ? [sel, { value: fieldValue(f), global: !!f.closest("#tab-settings") }] : null;
}
function noteDraft(e) {
  const d = !e.isComposing && draftOf(e.target);
  if (d) { drafts.set(...d); carried.delete(d[0]); }
}
document.addEventListener("input", noteDraft);
document.addEventListener("change", noteDraft);
// Rebuilding the field mid-IME (注音 not yet turned into characters) would cut the composition off:
// a re-render waits for it to end.
// Leaving the field or the window ends it too, in case the IME never says so.
function endComposing() { composing = false; if (renderLater) render(); }
document.addEventListener("compositionstart", () => { composing = true; });
document.addEventListener("compositionend", e => { noteDraft(e); endComposing(); });
// After the event, so a compositionend still on its way lands first and focus has settled.
const endComposingSoon = () => setTimeout(() => { if (composing) endComposing(); });
document.addEventListener("focusout", endComposingSoon);
window.addEventListener("blur", endComposingSoon);
// A field that saves on change and got its draft back from a re-render: the browser takes the draft
// as the value it had on focus, so leaving it fires no change. Send it on the way out instead.
const restored = new WeakSet();
const unlikeMarkup = f => isBox(f) ? f.checked !== f.defaultChecked
  : f.tagName === "SELECT" ? f.selectedIndex !== Math.max(0, [...f.options].findIndex(o => o.defaultSelected)) : f.value !== f.defaultValue;
document.addEventListener("change", e => restored.delete(e.target), true);
document.addEventListener("focusout", e => {
  if (restored.delete(e.target) && unlikeMarkup(e.target)) e.target.dispatchEvent(new Event("change"));
});

function render() {
  if (composing) { renderLater = true; return; }
  renderLater = false;
  keepTimeForm();
  const a = document.activeElement, ident = `${state.current}|${state.session?.id ?? ""}`;
  const focus = isField(a) ? fieldSel(a) : null, pos = a?.selectionStart ?? null;
  const moved = ident !== draftsFor;
  if (moved) {
    for (const [sel, d] of drafts) if (!d.global && sel !== focus) drafts.delete(sel);
    carried.clear();
    if (focus && drafts.has(focus) && !drafts.get(focus).global) carried.add(focus);
    draftsFor = ident;
  }
  const open = [...document.querySelectorAll("details[id][open]")].map(d => d.id);
  renderOverview(); renderReview(); renderSettings();
  for (const id of open) document.getElementById(id)?.setAttribute("open", "");
  if (state.warnings && state.warnings.length) status(state.warnings.join("；"), true);
  for (const [sel, d] of drafts) {
    const el = document.querySelector(sel);
    if (!el || fieldValue(el) === d.value) { drafts.delete(sel); carried.delete(sel); continue; }
    if (isBox(el)) el.checked = d.value; else el.value = d.value;
    if (sel !== focus) continue;
    if (!carried.has(sel)) restored.add(el);
    else if (moved) status("這格是在上一個 sprint／session 打的，還沒存", true);
  }
  const el = focus && document.querySelector(focus);
  if (el) { el.focus(); if (pos !== null) el.setSelectionRange(pos, pos); }
}

// Clicking a heading sorts by it, again reverses; starred tickets always come first.
let sortBy = null, sortDir = 1;
function sortTh(key, label, cls = "") {
  const mark = sortBy === key ? (sortDir > 0 ? " ▲" : " ▼") : "";
  return `<th class="${cls}" data-sort="${key}" title="點一下排序">${label}${mark}</th>`;
}
function sortedTickets(list) {
  const value = t => sortBy === "remaining" ? t.remaining : t[sortBy];
  const cmp = (a, b) => {
    if (a.starred !== b.starred) return a.starred ? -1 : 1;
    if (!sortBy) return 0;
    const x = value(a), y = value(b);
    if (x == null || y == null) return x == null && y == null ? 0 : x == null ? 1 : -1;   // empty last, either way
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), "zh-Hant", { numeric: true })) * sortDir;
  };
  return list.map((t, i) => [t, i]).sort(([a, i], [b, j]) => cmp(a, b) || i - j).map(([t]) => t);
}

// Points still to do against the room left: a workday holds 8 h ÷ hours-per-point points.
function pendingKpi(c, hpp) {
  const over = c.roomLeft != null && c.pending > c.roomLeft;
  const value = `<span style="color:var(--cubi-${over ? "danger" : "ink"})">${pts(c.pending)}</span>`;
  const sub = c.roomLeft == null ? "填起訖日期才能比容量"
    : `剩 ${c.workdaysLeft} 個工作日（${pts(c.roomLeft)} 點）` + (c.unestimated ? ` · ${c.unestimated} 張未估點` : "");
  const warn = c.room != null && c.planned > c.room ? `<span class="cubi-pill danger" title="假日不扣；1 個工作日 = 8 小時 = ${pts(8 / hpp)} 點">排了 ${pts(c.planned)} / 容量 ${pts(c.room)} 點</span>` : "";
  return kpi("待處理點數", "hourglass", value, sub + warn, null);
}

function kpi(title, icon, value, sub, delta) {
  const d = delta == null ? "" : `<span class="cubi-delta ${delta > 0 ? "up" : delta < 0 ? "down" : "flat"}">${delta > 0 ? "▲" : delta < 0 ? "▼" : "＝"} ${esc(Math.abs(delta))}</span>`;
  return `<div class="cubi-kpi"><div class="cubi-kpi-head">${esc(title)}${ic(icon)}</div><div class="cubi-kpi-value"><b>${value}</b>${d}</div><div class="cubi-kpi-sub">${sub}</div></div>`;
}

function header(title) {
  const s = state.sprint;
  const options = state.sprints.map(x => `<option value="${esc(x.label)}" ${x.label === state.current ? "selected" : ""}>${esc(x.name || x.label)}</option>`).join("");
  return `<div class="cubi-header"><h1 class="cubi-title">${esc(title)}</h1>
      ${s ? `<span class="cubi-pill">${ic("clock", 13)}${esc(s.start || "?")} – ${esc(s.end || "?")}</span>` : ""}
      <span class="cubi-spacer"></span>
      ${state.sprints.length ? `<select id="sprint-select" title="切換 sprint">${options}</select>` : ""}
      <button class="cubi-btn" id="new-btn">${ic("plus")}新 sprint</button>
      ${s ? `<button class="cubi-btn primary" id="sp-sync" title="照設定的 JQL 從 Jira 抓這個 sprint 的單">${ic("refresh")}同步 Jira</button>` : ""}
    </div>${pendingSprint ? `<div class="cubi-card"><div class="cubi-form">
      <div class="cubi-field"><label>Jira 標籤 ${tip("要跟 Jira 上的標籤一模一樣，例如 Sprint7")}</label><input id="new-label" placeholder="Sprint7"></div>
      <div class="cubi-field"><label>名稱</label><input id="new-name" placeholder="Sprint 7"></div>
      <div class="cubi-field"><label>開始</label><input id="new-start" type="date"></div>
      <div class="cubi-field"><label>結束</label><input id="new-end" type="date"></div>
      <div class="cubi-field" style="align-self:end"><div class="cubi-row"><button class="cubi-btn primary" id="new-save">建立</button><button class="cubi-btn" id="new-cancel">取消</button></div></div></div></div>` : ""}`;
}

function bindHeader(el) {
  $("#sprint-select", el)?.addEventListener("change", async e => {
    if (await refresh("sprint.select", { label: e.target.value }, [e.target])) return;
    drafts.delete("#sprint-select");
    const sel = $("#sprint-select"); if (sel) sel.value = state.current;
  });
  $("#new-btn", el)?.addEventListener("click", () => { pendingSprint = !pendingSprint; render(); });
  $("#new-save", el)?.addEventListener("click", async () => {
    pendingSprint = false;
    if (!await refresh("sprint.new", { label: $("#new-label").value.trim(), name: $("#new-name").value, start: $("#new-start").value, end: $("#new-end").value }, el.querySelectorAll("[id^=new-]"))) { pendingSprint = true; render(); }
  });
  $("#new-cancel", el)?.addEventListener("click", () => { pendingSprint = false; render(); });
  $("#sp-sync", el)?.addEventListener("click", () => refresh("sprint.sync"));
}

function statusTone(t) { return t.done || t.statusCategory === "done" ? "good" : t.statusCategory === "indeterminate" ? "info" : ""; }
function remainTone(t) { if (t.remaining == null || !t.estimate) return ""; const left = t.remaining / (t.estimate * state.config.hoursPerPoint * 3600); return left > 0.5 ? "good" : left > 0.2 ? "warning" : "danger"; }
function prevSprint() { const h = state.history; const i = h.findIndex(x => x.label === state.current); return i > 0 ? h[i - 1] : null; }

function renderOverview() {
  const el = $("#tab-overview"), s = state.sprint;
  let html = header(s ? (s.name || s.label) : "Sprint");
  if (state.timers.length) {
    html += `<div class="cubi-card"><div class="cubi-card-head">${ic("clock")}<h2 class="cubi-card-title">計時中</h2></div><table class="cubi-table tight"><tbody>` +
      state.timers.map(t => `<tr><td>${esc(t.name)}</td><td>${t.keys.map(link).join(" ")}</td>
        <td class="num"><span class="timer" data-since="${t.start}">${clock(Date.now() / 1000 - t.start)}</span></td>
        <td class="num"><button class="cubi-btn small" data-stop="${esc(t.sid)}">${ic("pause", 13)}停止並記下</button></td></tr>`).join("") + `</tbody></table></div>`;
  }
  if (state.session) html += sessionCard();
  if (!s) { el.innerHTML = html + `<div class="cubi-card cubi-muted">還沒有 sprint。按「新 sprint」，再「同步 Jira」。</div>`; bindOverview(el); return; }
  const m = s.metrics, prev = prevSprint(), hpp = state.config.hoursPerPoint;
  const rate = m.tickets ? Math.round(m.done / m.tickets * 100) : 0;
  html += `<div class="cubi-kpis">
      ${kpi("完成點數", "check", `${pts(m.donePoints)}<span class="cubi-muted"> / ${pts(m.estimate)}</span>`, prev ? `上個 sprint ${pts(prev.donePoints)} 點` : "估點合計", prev ? Math.round((m.donePoints - prev.donePoints) * 10) / 10 : null)}
      ${kpi("完成率", "target", `${rate}%`, `${m.done} / ${m.tickets} 張`, null)}
      ${pendingKpi(s.capacity, hpp)}
      ${kpi("投入", "clock", fmtH(m.seconds), m.ratio ? `實際 / 估點 ${m.ratio}` : "session＋手動", null)}
      ${kpi("會議", "users", fmtH(m.meetingSeconds), m.seconds ? `佔 ${Math.round(m.meetingSeconds / m.seconds * 100)}%` : "–", null)}
    </div>
    <div class="cubi-grid">
      <div class="cubi-card"><div class="cubi-card-head"><h2 class="cubi-card-title">任務分類</h2><span class="cubi-spacer"></span>${tip("點一類看那些單")}</div>${categoryBlock(s)}</div>
      <div class="cubi-card"><div class="cubi-card-head"><h2 class="cubi-card-title">剩餘點數</h2><span class="cubi-spacer"></span><span class="cubi-muted">— 理想　● 實際</span></div><div class="chart">${burndownChart(s.burndown)}</div></div>
    </div>
    <div class="cubi-card" style="margin-top:16px"><div class="cubi-card-head"><h2 class="cubi-card-title">工單</h2><span class="cubi-muted">${m.tickets} 張</span><span class="cubi-spacer"></span>
      <input id="add-key" placeholder="加單號" size="12"><button class="cubi-btn small" id="add-btn">${ic("plus", 13)}加</button></div>
    <div class="scroll-x"><table class="cubi-table fixed" style="min-width:720px">
    <colgroup><col style="width:36px"><col style="width:112px"><col><col style="width:104px"><col style="width:44px"><col style="width:88px"><col style="width:150px"><col style="width:64px"><col style="width:${state.config.actualPointsField ? 118 : 84}px"></colgroup>
    <thead><tr><th title="有星號的永遠排最上面">★</th>${sortTh("key", "單號")}<th>摘要</th>${sortTh("status", "狀態")}${sortTh("estimate", "估", "num")}<th class="num" title="投入 ÷ ${esc(hpp)} 小時，可覆寫">實</th>${sortTh("remaining", "剩餘")}${sortTh("seconds", "投入", "num")}<th></th></tr></thead><tbody>`;
  for (const t of sortedTickets(s.tickets)) {
    const rt = remainTone(t), budget = (t.estimate || 0) * hpp * 3600;
    const used = budget ? Math.min(100, Math.max(0, (budget - t.remaining) / budget * 100)) : 0;
    html += `<tr><td><button class="star ${t.starred ? "on" : ""}" data-star="${esc(t.key)}" title="${t.starred ? "取消重點" : "標成重點"}">${t.starred ? "★" : "☆"}</button></td>
      <td><span class="key"><span class="cubi-dot ${statusTone(t)}"></span>${link(t.key)}</span></td>
      <td class="clip" title="${esc(t.summary)}${t.notes ? "\n" + esc(t.notes) : ""}">${esc(t.summary)}</td>
      <td title="${esc(t.status || "")}"><span class="cubi-pill ${statusTone(t)}">${esc(t.status || "–")}</span></td>
      <td class="num">${pts(t.estimate)}</td>
      <td class="num"><input class="actual" type="number" step="0.1" min="0" value="${t.override ?? ""}" placeholder="${t.autoActual ?? "–"}" data-actual="${esc(t.key)}" title="${t.override != null ? "手動覆寫；自動算是 " + pts(t.autoActual) : "自動算的；填數字可覆寫"}"></td>
      <td>${t.remaining == null ? `<span class="cubi-muted">未估點</span>` : `<div class="remain"><div class="cubi-bar ${rt}"><i style="width:${used}%"></i></div><span style="color:var(--cubi-${rt || "ink2"})">${t.remaining < 0 ? "超 " + fmtH(-t.remaining) : fmtH(t.remaining)}</span></div>`}</td>
      <td class="num" title="session ${fmtH(t.sessionSeconds)}，手動 ${fmtH(t.manualSeconds)}">${fmtH(t.seconds)}</td>
      <td class="num"><span class="cubi-row" style="justify-content:flex-end;flex-wrap:nowrap">
        <button class="cubi-btn icon" data-time="${esc(t.key)}" title="補時數（會議、討論）">${ic("plus", 15)}</button>
        <button class="cubi-btn icon" data-transition="${esc(t.key)}" title="換 Jira 狀態">${ic("flag", 15)}</button>
        ${state.config.actualPointsField ? `<button class="cubi-btn icon" data-push="${esc(t.key)}" title="實際點數寫回 Jira">${ic("download", 15)}</button>` : ""}</span></td></tr>`;
    if (pendingTime && pendingTime.key === t.key) html += timeFormRow(t.key);
  }
  html += `</tbody></table></div></div>` + sprintInfoCard(s) + manualCard(s);
  el.innerHTML = html;
  bindOverview(el);
  const f = $("#t-min", el); if (f && pendingTime && pendingTime.focus) { f.focus(); pendingTime.focus = false; }
}

function sessionCard() {
  const b = state.session;
  return `<div class="cubi-card"><div class="cubi-card-head">${ic("link")}<h2 class="cubi-card-title">這個 session</h2><span class="cubi-muted">${esc(b.name)}</span><span class="cubi-spacer"></span>
      ${b.keys.length > 1 ? `<button class="cubi-btn small" id="shares-btn" title="把目前比例套到本 sprint 已記錄的時段">套用比例到本 sprint</button>` : ""}</div>
    ${b.keys.length ? `<table class="cubi-table tight"><tbody>` + b.keys.map(k => { const t = (state.sprint?.tickets || []).find(x => x.key === k) || {};
      return `<tr><td>${link(k)}</td><td class="clip">${esc(t.summary || "")}</td><td class="num"><input type="number" min="0" max="100" value="${b.shares[k] ?? ""}" data-share="${esc(k)}" style="width:64px" title="時數分給這張單的比例"> %</td>
        <td class="num"><button class="cubi-btn icon" data-unbind="${esc(k)}" title="解除">${ic("x", 14)}</button></td></tr>`; }).join("") + `</tbody></table>` : `<div class="cubi-muted">還沒綁單。</div>`}
    <div class="cubi-row" style="margin-top:10px"><input id="bind-key" placeholder="單號，可多個" size="18"><button class="cubi-btn small" id="bind-btn">${ic("plus", 13)}綁定</button>
      <span class="cubi-muted">自動抓到：${esc(b.auto.join(" ") || "沒有")}</span>${tip("名稱、分支、目錄（" + (b.cwd || "?") + "）裡的單號會自動綁；多張單時數預設平分")}</div></div>`;
}

function sprintInfoCard(s) {
  return `<details class="cubi-card" id="sprint-info"><summary class="cubi-card-title" style="cursor:pointer">Sprint 資訊</summary><div class="cubi-form" style="margin-top:12px">
      <div class="cubi-field"><label>名稱</label><input id="sp-name" value="${esc(s.name || "")}"></div>
      <div class="cubi-field"><label>開始</label><input id="sp-start" type="date" value="${esc(s.start || "")}"></div>
      <div class="cubi-field"><label>結束</label><input id="sp-end" type="date" value="${esc(s.end || "")}"></div>
      <div class="cubi-field" style="grid-column: span 2"><label>目標</label><input id="sp-goal" value="${esc(s.goal || "")}"></div>
      <div class="cubi-field" style="align-self:end"><div class="cubi-row"><button class="cubi-btn primary" id="sp-save">儲存</button>
        <button class="cubi-btn" id="sp-resync" title="sprint 變成跟 Jira 查詢結果一模一樣，拿掉不在結果裡的單">重抓並清掉</button></div></div></div></details>`;
}

function manualCard(s) {
  if (!s.manual.length) return "";
  return `<details class="cubi-card" id="manual-times"><summary class="cubi-card-title" style="cursor:pointer">手動時段 ${s.manual.length} 筆</summary><table class="cubi-table tight" style="margin-top:8px"><tbody>` +
    s.manual.map(x => `<tr><td>${(Object.keys(x.shares || { [x.key]: 100 })).map(esc).join(" ")}</td><td>${new Date(x.start * 1000).toLocaleString("zh-TW")}</td><td class="num">${fmtH(x.end - x.start)}</td>
      <td><span class="cubi-pill">${esc(x.kind)}</span> ${esc(x.note || x.reason || "")}</td><td>${x.calendar ? ic("clock", 13) : ""}</td>
      <td class="num"><button class="cubi-btn icon" data-remove-time="${esc(x.id)}" title="刪除">${ic("x", 14)}</button></td></tr>`).join("") + `</tbody></table></details>`;
}

// The ＋時數 form sits right under its ticket's row and keeps what was typed across re-renders.
function timeFormRow(key) {
  const p = pendingTime;
  return `<tr><td colspan="9" style="white-space:normal;overflow:visible"><div class="cubi-inline cubi-row" data-time-form="${esc(key)}"><b>${esc(key)}</b>
    <input id="t-start" type="datetime-local" value="${esc(p.start)}">
    <input id="t-min" type="number" min="1" max="1440" value="${esc(p.minutes)}" style="width:80px"> 分
    <select id="t-kind">${["開發", "會議", "討論", "其他"].map(k => `<option ${k === p.kind ? "selected" : ""}>${k}</option>`).join("")}</select>
    <input id="t-note" placeholder="備註" value="${esc(p.note)}" size="18">
    <label class="cubi-row" style="gap:4px"><input id="t-cal" type="checkbox" ${p.calendar ? "checked" : ""}> 寫進行事曆</label>
    <span class="cubi-spacer"></span><button class="cubi-btn primary small" id="t-save">加</button><button class="cubi-btn small" id="t-cancel">取消</button></div></td></tr>`;
}
function keepTimeForm() {
  if (!pendingTime || !$(`[data-time-form="${CSS.escape(pendingTime.key)}"]`)) return;
  pendingTime = { ...pendingTime, start: $("#t-start").value, minutes: $("#t-min").value, kind: $("#t-kind").value, note: $("#t-note").value, calendar: $("#t-cal").checked };
}
function openTimeForm(key) {
  const d = new Date(Date.now() - 3600 * 1000), local = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  pendingTime = pendingTime && pendingTime.key === key ? null : { key, start: local, minutes: 60, kind: "會議", note: "", calendar: true, focus: true };
  render();
}

function bindOverview(el) {
  bindHeader(el);
  $("#add-btn", el)?.addEventListener("click", () => refresh("ticket.add", { key: $("#add-key").value }, [$("#add-key")]));
  $("#bind-btn", el)?.addEventListener("click", () => refresh("session.bind", { key: $("#bind-key").value }, [$("#bind-key")]));
  $("#shares-btn", el)?.addEventListener("click", () => refresh("session.shares", { shares: currentShares(), applyToSprint: true }, el.querySelectorAll("[data-share]")));
  $("#sp-save", el)?.addEventListener("click", () => refresh("sprint.update", { name: $("#sp-name").value, start: $("#sp-start").value, end: $("#sp-end").value, goal: $("#sp-goal").value }, el.querySelectorAll("[id^=sp-]")));
  $("#sp-resync", el)?.addEventListener("click", () => refresh("sprint.sync", { replace: true }));
  $("#t-save", el)?.addEventListener("click", async () => { keepTimeForm(); const p = pendingTime; pendingTime = null;
    if (!await refresh("time.add", { key: p.key, start: p.start, minutes: Number(p.minutes), kind: p.kind, note: p.note, calendar: p.calendar })) { pendingTime = p; render(); } });
  $("#t-cancel", el)?.addEventListener("click", () => { pendingTime = null; render(); });
  el.querySelectorAll("[data-share]").forEach(i => i.addEventListener("change", () => refresh("session.shares", { shares: currentShares() }, el.querySelectorAll("[data-share]"))));
  el.querySelectorAll("[data-unbind]").forEach(x => x.addEventListener("click", () => refresh("session.unbind", { key: x.dataset.unbind })));
  el.querySelectorAll("[data-actual]").forEach(i => i.addEventListener("change", () => refresh("ticket.update", { key: i.dataset.actual, actual: i.value }, [i])));
  el.querySelectorAll("[data-push]").forEach(b => b.addEventListener("click", () => refresh("points.push", { key: b.dataset.push })));
  el.querySelectorAll("[data-remove-time]").forEach(b => b.addEventListener("click", () => refresh("time.remove", { id: b.dataset.removeTime })));
  el.querySelectorAll("[data-time]").forEach(b => b.addEventListener("click", () => openTimeForm(b.dataset.time)));
  el.querySelectorAll("[data-transition]").forEach(b => b.addEventListener("click", () => transitionMenu(b.dataset.transition, b)));
  el.querySelectorAll("[data-star]").forEach(b => b.addEventListener("click", () => refresh("ticket.update", { key: b.dataset.star, starred: !b.classList.contains("on") })));
  el.querySelectorAll("th[data-sort]").forEach(h => h.addEventListener("click", () => { sortDir = sortBy === h.dataset.sort ? -sortDir : 1; sortBy = h.dataset.sort; render(); }));
  el.querySelectorAll("[data-stop]").forEach(b => b.addEventListener("click", () => refresh("timer.stop", { sid: b.dataset.stop })));
  bindCategories(el);
}

function currentShares() { const o = {}; document.querySelectorAll("[data-share]").forEach(i => { o[i.dataset.share] = Number(i.value) || 0; }); return o; }

async function transitionMenu(key, button) {
  let data;
  try { data = await call("ticket.transition", { key }); } catch (_) { return; }
  const sel = document.createElement("select");
  sel.innerHTML = `<option value="">換狀態…</option>` + data.transitions.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");
  sel.onchange = () => { if (sel.value) refresh("ticket.transition", { key, id: sel.value }); };
  button.replaceWith(sel);
  sel.focus();
}

// ---------- categories (overview and review share it) ----------
function categoryBlock(s) {
  const cats = s.categories, counts = cats.map(c => s.metrics.categories[c] || 0);
  const selected = selectedCategory && cats.includes(selectedCategory) ? selectedCategory : null;
  const group = selected ? s.tickets.filter(t => t.category === selected) : [];
  let html = `<div class="donut-wrap">${donut(counts, cats)}<div class="cubi-split">${cats.map((c, i) =>
    `<button data-cat="${esc(c)}" class="${selected === c ? "on" : ""}" style="border-color:${CAT_COLORS[i]}"><b>${counts[i]}</b><span>${esc(c)}</span></button>`).join("")}</div></div>`;
  if (selected) {
    html += `<div class="scroll-x"><table class="cubi-table tight fixed" style="margin-top:12px;min-width:360px"><colgroup><col style="width:104px"><col><col style="width:76px"><col style="width:60px"></colgroup><tbody>` + (group.length ? group.map(t => `<tr><td>${link(t.key)}</td><td class="clip" title="${esc(t.summary)}">${esc(t.summary)}</td>
      <td class="num">${pts(t.estimate)} → ${pts(t.actual)}</td><td class="num">${fmtH(t.seconds)}</td></tr>`).join("") : `<tr><td class="cubi-muted" colspan="4">沒有單</td></tr>`) + `</tbody></table></div>`;
  }
  return html;
}
function bindCategories(el) {
  el.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => { selectedCategory = selectedCategory === b.dataset.cat ? null : b.dataset.cat; render(); }));
}

// ---------- review ----------
function renderReview() {
  const el = $("#tab-review"), s = state.sprint;
  if (!s) { el.innerHTML = `<div class="cubi-card cubi-muted">還沒有 sprint，到「總覽」建立。</div>`; return; }
  const r = s.review;
  el.innerHTML = `<div class="cubi-header"><h1 class="cubi-title">${esc(s.name || s.label)} 回顧</h1><span class="cubi-spacer"></span>
      <button class="cubi-btn primary" id="brief" title="開一個 Claude Code session 讀這個 sprint 的數據，寫好填回這裡">${ic("sparkles")}用 Claude 整理</button>
      <button class="cubi-btn" id="export">${ic("download")}匯出 Markdown</button></div>
    <div class="cubi-grid">
      <div class="cubi-card"><div class="cubi-card-head"><h2 class="cubi-card-title">任務分類</h2></div>${categoryBlock(s)}</div>
      <div class="cubi-card"><div class="cubi-card-head"><h2 class="cubi-card-title">近幾個 sprint</h2><span class="cubi-spacer"></span>${tip("長條＝完成點數，下面數字＝實際/估點")}</div><div class="chart">${historyChart(state.history)}</div></div>
    </div>
    <div class="cubi-card" style="margin-top:16px">
      <div class="cubi-field"><label>總結</label><textarea data-list="summary" style="min-height:64px" placeholder="兩到三句">${esc(r.summary || "")}</textarea></div>
      <div class="lists" style="margin-top:14px">
        <div class="cubi-field"><label>做得好</label><textarea data-list="wentWell" placeholder="一行一條">${esc(r.wentWell.join("\n"))}</textarea></div>
        <div class="cubi-field"><label>要改善</label><textarea data-list="toImprove" placeholder="一行一條">${esc(r.toImprove.join("\n"))}</textarea></div>
        <div class="cubi-field"><label>改善建議</label><textarea data-list="suggestions" placeholder="一行一條">${esc(r.suggestions.join("\n"))}</textarea></div>
        <div class="cubi-field"><label>想感謝 ${tip("一行一位：名字：原因")}</label><textarea data-list="thanks" placeholder="名字：原因">${esc(r.thanks.map(t => `${t.who}：${t.why}`).join("\n"))}</textarea></div>
      </div></div>`;
  $("#export", el).onclick = () => call("review.export").catch(() => {});
  $("#brief", el).onclick = startBrief;
  bindCategories(el);
  // A field only writes back what the user changed: a blur on an untouched textarea after a
  // refresh must not overwrite what Claude (or another window) just saved.
  el.querySelectorAll("[data-list]").forEach(t => t.addEventListener("change", () => {
    if (t.value === t.defaultValue) return;
    const lines = t.value.split("\n").map(x => x.trim()).filter(Boolean);
    const value = t.dataset.list === "summary" ? t.value.trim()
      : t.dataset.list === "thanks" ? lines.map(l => { const i = l.search(/[:：]/); return i < 0 ? { who: l, why: "" } : { who: l.slice(0, i).trim(), why: l.slice(i + 1).trim() }; }) : lines;
    refresh("review.update", { [t.dataset.list]: value }, [t]);
  }));
}

async function startBrief() {
  let b;
  try { b = await call("review.brief"); } catch (_) { return; }
  status("正在開 Claude Code…");
  let r;
  try { r = await bridge().postMessage({ action: "session.new", args: [JSON.stringify({ directory: b.directory, prompt: b.prompt })] }); }
  catch (e) { status(String(e.message || e), true); return; }
  if (!r.ok) { status(r.cancelled ? "" : (r.err || "開不了 session"), !r.cancelled); return; }
  status(`已在 ${b.directory} 開 session；每 30 秒看一次，寫好就出現（資料檔 ${b.file}）`);
  const before = JSON.stringify(state.sprint?.review), started = Date.now();
  clearInterval(briefPoll);
  briefPoll = setInterval(async () => {
    if (!await refresh()) return;
    if (JSON.stringify(state.sprint?.review) !== before) { clearInterval(briefPoll); status("Claude 寫回來了"); }
    else if (Date.now() - started > 3600 * 1000) { clearInterval(briefPoll); }
  }, 30000);
}

// ---------- charts: inline SVG; categories have fixed colours, text stays in ink ----------
const W = 440;
function donut(counts, cats) {
  const total = counts.reduce((a, b) => a + b, 0), R = 66, r = 44, cx = 75, cy = 75;
  if (!total) return `<svg viewBox="0 0 150 150"><circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="var(--cubi-line)" stroke-width="${R - r}"/></svg>`;
  let a0 = -Math.PI / 2, g = "";
  counts.forEach((n, i) => {
    if (!n) return;
    const dim = selectedCategory && selectedCategory !== cats[i] ? " dim" : "";
    if (n === total) { g += `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${CAT_COLORS[i]}" stroke-width="${R - r}" class="slice${dim}" data-cat="${esc(cats[i])}" style="cursor:pointer"><title>${esc(cats[i])} ${n} 張</title></circle>`; return; }
    const a1 = a0 + n / total * 2 * Math.PI, big = a1 - a0 > Math.PI ? 1 : 0, p = (a, rad) => `${cx + rad * Math.cos(a)},${cy + rad * Math.sin(a)}`;
    g += `<path class="slice${dim}" d="M ${p(a0, R)} A ${R} ${R} 0 ${big} 1 ${p(a1, R)} L ${p(a1, r)} A ${r} ${r} 0 ${big} 0 ${p(a0, r)} Z" fill="${CAT_COLORS[i]}" data-cat="${esc(cats[i])}"><title>${esc(cats[i])} ${n} 張</title></path>`;
    a0 = a1;
  });
  g += `<text x="${cx}" y="${cy + 2}" text-anchor="middle" style="font-size:22px;font-weight:700;fill:var(--cubi-ink)">${total}</text><text x="${cx}" y="${cy + 18}" text-anchor="middle">張</text>`;
  return `<svg viewBox="0 0 150 150">${g}</svg>`;
}
function burndownChart(b) {
  if (!b.length) return `<div class="cubi-muted">sprint 要有起訖日期（Sprint 資訊）。</div>`;
  const H = 170, left = 30, bottom = 22, top = 10, max = Math.max(1, b[0].ideal, ...b.map(p => p.actual || 0));
  const x = i => left + i / Math.max(1, b.length - 1) * (W - left - 10), y = v => top + (1 - v / max) * (H - top - bottom);
  const actual = b.map((p, i) => [p, i]).filter(([p]) => p.actual != null);
  const line = actual.map(([p, i]) => `${x(i)},${y(p.actual)}`).join(" ");
  const area = actual.length ? `${x(actual[0][1])},${y(0)} ${line} ${x(actual[actual.length - 1][1])},${y(0)}` : "";
  let g = `<defs><linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--cubi-accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--cubi-accent)" stop-opacity="0"/></linearGradient></defs>`;
  [0, 0.5, 1].forEach(f => { g += `<line x1="${left}" x2="${W - 10}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--cubi-line2)"/><text x="${left - 6}" y="${y(max * f) + 4}" text-anchor="end">${pts(max * f)}</text>`; });
  g += `<polyline points="${b.map((p, i) => `${x(i)},${y(p.ideal)}`).join(" ")}" fill="none" stroke="var(--cubi-ink3)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  if (area) g += `<polygon points="${area}" fill="url(#bd)"/><polyline points="${line}" fill="none" stroke="var(--cubi-accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  actual.forEach(([p, i]) => { g += `<circle cx="${x(i)}" cy="${y(p.actual)}" r="3" fill="var(--cubi-accent)"><title>${p.date} 剩 ${p.actual}</title></circle>`; });
  g += `<text x="${left}" y="${H - 4}">${b[0].date.slice(5)}</text><text x="${W - 10}" y="${H - 4}" text-anchor="end">${b[b.length - 1].date.slice(5)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function historyChart(hist) {
  if (hist.length < 2) return `<div class="cubi-muted">有兩個以上的 sprint 才有趨勢。</div>`;
  const H = 150, max = Math.max(1, ...hist.map(h => h.donePoints)), slot = (W - 20) / hist.length, bw = Math.min(46, slot - 16);
  let g = "";
  hist.forEach((h, i) => {
    const cx = 10 + i * slot + slot / 2, bh = Math.max(4, h.donePoints / max * 90), y = 108 - bh, on = h.label === state.current;
    g += `<rect x="${cx - bw / 2}" y="${18}" width="${bw}" height="90" rx="10" fill="var(--cubi-line2)"/>
      <rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${bh}" rx="10" fill="${on ? "var(--cubi-accent)" : "var(--cubi-ink3)"}" opacity="${on ? 1 : .45}"><title>${esc(h.label)} 完成 ${pts(h.donePoints)} 點</title></rect>
      <text x="${cx}" y="${y - 5}" text-anchor="middle" style="fill:var(--cubi-ink);font-weight:600">${pts(h.donePoints)}</text>
      <text x="${cx}" y="126" text-anchor="middle" style="${on ? "fill:var(--cubi-accent);font-weight:600" : ""}">${esc(h.label)}</text><text x="${cx}" y="142" text-anchor="middle">${h.ratio ?? "–"}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

// ---------- settings ----------
function renderSettings() {
  const el = $("#tab-settings"), c = state.config;
  const projects = String(c.projectKey ?? "").split(/[,\s]+/).filter(Boolean);
  const sent = String(c.jql ?? "").replace("{projects}", projects.join(", ")).replace("{project}", projects[0] || "").replace("{label}", state.current || "…");
  const field = (k, label, hint, type = "text") => `<div class="cubi-field"><label for="c-${k}">${label} ${hint ? tip(hint) : ""}</label><input id="c-${k}" type="${type}" value="${esc(c[k] ?? "")}"></div>`;
  el.innerHTML = `<div class="cubi-header"><h1 class="cubi-title">設定</h1><span class="cubi-spacer"></span><button class="cubi-btn primary" id="c-save">${ic("check")}儲存</button></div>
    <div class="cubi-card"><div class="cubi-section-title">Jira</div><div class="cubi-form">
      ${field("site", "站台", "例如 example.atlassian.net")}
      ${field("netrc", "帳密檔", `netrc 一行：machine <站台> login <email> password <API token>${state.netrcFound ? "" : "（現在找不到這個檔）"}`)}
      ${field("projectKey", "專案 key", "可多個，逗號分開")}
      ${field("pointsField", "估點欄位", "Story point estimate 通常是 customfield_10016")}
      ${field("actualPointsField", "實際點數欄位", "留空就只存本機；填了表格才有寫回")}
    </div>${state.netrcFound ? "" : `<div class="cubi-row" style="margin-top:10px"><span class="cubi-pill danger">找不到帳密檔</span></div>`}
    <div class="cubi-section-title">同步</div><div class="cubi-form">
      <div class="cubi-field" style="grid-column: 1 / -1"><label for="c-jql">JQL ${tip("本期會送出：" + sent)}</label><input id="c-jql" value="${esc(c.jql ?? "")}"></div>
      ${field("hoursPerPoint", "每點小時數", "實際點數＝投入時數 ÷ 這個數", "number")}
    </div>
    <div class="cubi-section-title">回顧</div><div class="cubi-form">
      ${field("reviewDir", "Markdown 資料夾", "匯出 <資料夾>/<標籤>.md；整理用的資料檔也在這")}
      ${field("reviewSessionDir", "整理用的 session 開在", "「用 Claude 整理」在這裡開 Claude Code")}
    </div></div>`;
  $("#c-save", el).onclick = () => { const p = {}; ["site", "netrc", "projectKey", "jql", "pointsField", "actualPointsField", "hoursPerPoint", "reviewDir", "reviewSessionDir"].forEach(k => { p[k] = $("#c-" + k).value; }); refresh("config.set", p, el.querySelectorAll("[id^=c-]")); };
}

// ---------- boot ----------
// Switching tabs only shows and hides: every tab stays rendered, so nothing typed in one is lost.
function showTab(tab) {
  document.querySelectorAll(".cubi-nav-item").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  for (const k of Object.keys(TABS)) $("#tab-" + k).hidden = k !== tab;
}
$("#brand").innerHTML = ic("target", 18) + "Sprint";
document.querySelectorAll(".cubi-nav-item").forEach(b => { const [i, t] = TABS[b.dataset.tab]; b.innerHTML = ic(i) + t; b.addEventListener("click", () => showTab(b.dataset.tab)); });
setInterval(() => state && state.timers.length && document.querySelectorAll(".timer[data-since]").forEach(t => { const secs = Date.now() / 1000 - Number(t.dataset.since); t.textContent = clock(secs); t.classList.toggle("long", secs > 8 * 3600); }), 1000);
window.addEventListener("cubisession", () => { session = window.cubiSession || null; refresh(); });
refresh();
</script>
