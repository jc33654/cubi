name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: swift --version
      - run: swift build
      - run: swift test
      # No signing identity here: bundle.sh falls back to ad-hoc and still runs the
      # "no local paths in the bundle" gate.
      - run: make bundle
