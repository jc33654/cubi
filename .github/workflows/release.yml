name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"] # bundle.sh accepts digits and dots only; no -rc tags

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the tag must be present for bundle.sh to stamp the version
      - run: swift --version
      - run: swift test

      # The self-signed cubi-dev certificate, exported from Keychain Access as .p12 and stored
      # base64-encoded. A fresh keychain on this throwaway runner; no trust settings needed,
      # codesign signs with an untrusted identity just fine.
      - name: Import signing certificate
        env:
          CUBI_CERT_P12: ${{ secrets.CUBI_CERT_P12 }}
          CUBI_CERT_PASSWORD: ${{ secrets.CUBI_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/cubi.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CUBI_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cubi-dev.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cubi-dev.p12" -k "$KEYCHAIN" -P "$CUBI_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed "s/\"//g")
          rm "$RUNNER_TEMP/cubi-dev.p12"
          security find-identity -p codesigning "$KEYCHAIN"

      - run: make icon
      - run: CUBI_SIGN_IDENTITY=cubi-dev make dist
      # Unpack the zip we are about to publish and check it the way install.sh will: the
      # requirement (bundle id + certificate hash) is read from install.sh so there is one source.
      - name: Verify the artefact the way install.sh will
        run: |
          set -euo pipefail
          REQUIREMENT="$(sed -n "s/^REQUIREMENT='\(.*\)'$/\1/p" scripts/install.sh)"
          [ -n "$REQUIREMENT" ]
          ditto -x -k build/Cubi.zip "$RUNNER_TEMP/unpacked"
          codesign --verify --strict -R="$REQUIREMENT" "$RUNNER_TEMP/unpacked/Cubi.app"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/unpacked/Cubi.app/Contents/Info.plist")"
          if [ "$VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "bundle says $VERSION but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            build/Cubi.zip
            build/Cubi.zip.sha256
          generate_release_notes: true
