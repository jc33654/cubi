<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Sprint</title>
<style>
  /* Only what the cubi style kit (manifest panel.style: "cubi") does not already give. */
  .tight td { padding-top: 8px; padding-bottom: 8px; }
  .key { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; white-space: nowrap; }
  .hours-btn { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
  .hours-btn:hover, .hours-btn.on { color: var(--cubi-accent); }
  .hours-btn small { color: var(--cubi-ink3); }
  .kinds { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; }
  .kinds span { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .kinds b { font-weight: 600; margin-right: 4px; }
  table.entries { margin-top: 8px; width: auto; }
  table.entries td { white-space: nowrap; overflow: visible; padding: 4px 14px 4px 0; border: 0; font-size: 12px; }
  table.entries td.note { white-space: normal; }
  /* Fixed columns: the summary takes what is left (cut with …), so the table never runs past its card. */
  .scroll-x { overflow-x: auto; }
  table.fixed .remain { min-width: 0; }
  /* 換狀態: the menu floats over the row, wider than the action column. */
  td.actions.choosing { overflow: visible; position: relative; }
  td.actions.choosing select { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 220px; z-index: 2; }
  table.fixed { table-layout: fixed; }
  table.fixed td { overflow: hidden; white-space: nowrap; }
  table.fixed td.clip { max-width: none; text-overflow: ellipsis; }
  table.fixed .cubi-pill { max-width: 100%; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: middle; }
  th[data-sort] { cursor: pointer; user-select: none; }
  th[data-sort]:hover { color: var(--cubi-ink); }
  .star { background: none; border: 0; padding: 0; font-size: 15px; line-height: 1; cursor: pointer; color: var(--cubi-ink3); }
  .star.on { color: var(--cubi-warning); }
  .remain { display: flex; align-items: center; gap: 8px; min-width: 150px; }
  .remain .cubi-bar { flex: 1; }
  .remain span { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 58px; text-align: right; }
  .donut-wrap { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: center; }
  .donut-wrap svg { width: 150px; height: 150px; }
  .donut-wrap .cubi-split { grid-auto-flow: row; gap: 2px; }
  .donut-wrap .cubi-split > button { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-bottom: 0; border-left: 4px solid; border-radius: 6px; }
  .donut-wrap .cubi-split > button b { font-size: 15px; order: 2; }
  .chart svg { width: 100%; height: auto; display: block; }
  svg text { font: 11px -apple-system, sans-serif; fill: var(--cubi-ink3); }
  svg path.slice { cursor: pointer; stroke: var(--cubi-card); stroke-width: 2; }
  svg .slice.dim { opacity: .3; }
  .lists { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .lists textarea { min-height: 96px; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }
  .timer.long { color: var(--cubi-danger); }
  table.fixed tr.ai-row td { padding-top: 0; white-space: normal; }
  .ai-suggest { gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; background: var(--cubi-bg); flex-wrap: wrap; }
  .ai-reason { color: var(--cubi-ink2); flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
  .dir-note { color: var(--cubi-ink3); font-size: 12px; grid-column: 1 / -1; margin: 0; }
  .ai-hint { color: var(--cubi-ink3); font-size: 12px; flex-basis: 100%; }
  /* 改／✕ icon buttons keep their size in a squeezed table column (they shrank to empty slivers). */
  .cubi-btn.icon, .cubi-btn.icon > svg { flex: none; }
  /* The tickets table on a narrow panel (fitTickets): the summary under the key, no bars or points, buttons in rows of three. */
  td.actions .acts { justify-content: flex-end; flex-wrap: nowrap; gap: 4px; }
  table.tickets.compact td.actions .acts { flex-wrap: wrap; }
  table.tickets.compact .sum { padding: 0; overflow: hidden; font-size: 0; border-left: 0; border-right: 0; }
  table.tickets.compact .sum2 { font-size: 12px; color: var(--cubi-ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  table.tickets.compact .remain .cubi-bar, table.tickets.compact td.num .hours-btn small { display: none; }
  table.tickets.compact input.est { width: 44px !important; }
  table.tickets.compact td.st { padding-left: 4px; padding-right: 4px; }
  .dir-row { grid-column: 1 / -1; flex-wrap: nowrap; }
  .cubi-field:has(> #c-estimateSessionDir) { grid-column: 1 / -1; }   /* as wide as the project rows below it */
  .dir-row .dir-key { width: 56px; font-weight: 600; flex: none; }
  .dir-row input { flex: 1 1 auto; min-width: 0; }
  .ai-pick { margin: 0; vertical-align: middle; width: 16px; height: 16px; }   /* in the star's column while choosing */
  .ai-pick:disabled { opacity: .3; cursor: not-allowed; }
  /* A narrow panel: the side menu keeps only its icons (names on hover), the room goes to the page. */
  .cubi-app.nav-mini { grid-template-columns: 60px 1fr; }
  .nav-mini .cubi-nav { padding: 18px 8px; }
  .nav-mini .cubi-brand, .nav-mini .cubi-nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
  .nav-mini .nav-t { display: none; }
  .ai-pickbar { margin: 4px 0 8px; }
  .owner-tag { font-size: 11.5px; color: var(--cubi-warning); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .reassign-bar { margin: 4px 0 8px; }
  .reassign-bar .who { display: inline-flex; align-items: center; gap: 6px; margin-right: 10px; white-space: nowrap; }
  .outside-tag { display: block; margin: 2px 0 0 auto; padding: 0; border: 0; background: none; font: inherit; font-size: 11px; color: var(--cubi-ink3); cursor: pointer; text-decoration: underline dotted; }
  .outside-tag.on, .outside-tag:hover { color: var(--cubi-accent); }
  /* The 補記時間 (a ticket's, a work item's, 新工作項目) and 修改 forms: one height for every control, kept in groups that wrap whole. */
  [data-time-form] { gap: 8px 12px; align-items: center; }
  [data-time-form] > b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  [data-time-form] input:not([type=checkbox]), [data-time-form] select, [data-time-form] .cubi-btn { height: 32px; box-sizing: border-box; font-size: 13px; line-height: 1; }
  [data-time-form] input:not([type=checkbox]), [data-time-form] select { padding: 0 8px; }
  [data-time-form] .cubi-btn { padding: 0 12px; justify-content: center; min-width: 56px; }
  [data-time-form] .grp { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; height: 32px; }
  [data-time-form] .grp input[type=checkbox] { margin: 0; }
  [data-time-form] .grp.actions { margin-left: auto; }
  [data-time-form] #t-note, [data-time-form] #e-note { flex: 1 1 140px; min-width: 120px; }
  [data-time-form] .brk { flex-basis: 100%; height: 0; }   /* line 1: what and when; line 2: note, ticks, buttons */
  [data-time-form] .over-note { flex-basis: 100%; white-space: normal; font-size: 12px; display: flex; gap: 4px; align-items: center; }
  /* Inside the tickets table (wider than the card on a narrow panel, so it scrolls) a form keeps to
     the part that shows: as wide as the scroller, held at its left edge. */
  .scroll-x [data-time-form] { position: sticky; left: 0; box-sizing: border-box; }   /* its max-width: fitForms */
  #c-estimateRules { min-height: 150px; }
  #status { display: flex; align-items: flex-start; gap: 10px; }
  #status[hidden] { display: none; }
  #status-body { flex: 1; min-width: 0; }
  #status-detail summary { cursor: pointer; margin-top: 4px; opacity: .85; }
  #status-lines { margin-top: 2px; max-height: 40vh; overflow-y: auto; }
  #status-lines > div { margin-top: 2px; }
  /* A 32×32 target around a small icon; the negative margins keep it from making the box taller. */
  #status-close { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; margin: -8px -10px -8px -6px;
    background: none; border: 0; border-radius: 8px; padding: 0; color: inherit; cursor: pointer; line-height: 0; opacity: .8; }
  #status-close[hidden] { display: none; }
  #status-close:hover { opacity: 1; background: rgba(255,255,255,.18); }
</style>
</head>
<body>
<div class="cubi-app">
  <nav class="cubi-nav">
    <div class="cubi-brand" id="brand">Sprint</div>
    <button class="cubi-nav-item on" data-tab="overview"></button>
    <button class="cubi-nav-item" data-tab="review"></button>
    <button class="cubi-nav-item" data-tab="settings"></button>
  </nav>
  <main class="cubi-main">
    <section id="tab-overview"></section>
    <section id="tab-review" hidden></section>
    <section id="tab-settings" hidden></section>
  </main>
</div>
<div class="cubi-status" id="status" hidden><div id="status-body"><span id="status-text"></span><details id="status-detail" hidden><summary>明細</summary><div id="status-lines"></div></details></div><button type="button" id="status-close" title="關閉" aria-label="關閉" hidden></button></div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const ic = (n, s) => (window.cubiIcon ? window.cubiIcon(n, s) : "");
const fmtH = secs => { if (!secs || Math.abs(secs) < 60) return "–"; const m = Math.floor(Math.abs(secs) / 60), h = Math.floor(m / 60); return h ? `${h}h${String(m % 60).padStart(2, "0")}m` : `${m}m`; };
const clock = secs => { const s = Math.max(0, Math.floor(secs)); return [s / 3600, s / 60 % 60, s % 60].map(v => String(Math.floor(v)).padStart(2, "0")).join(":"); };
const pts = v => v == null ? "–" : String(Math.round(v * 100) / 100);
const CAT_COLORS = ["var(--cubi-c2)", "var(--cubi-c4)", "var(--cubi-c1)", "var(--cubi-c3)", "var(--cubi-c5)"];
const TABS = { overview: ["dashboard", "總覽"], review: ["review", "回顧"], settings: ["settings", "設定"] };
let state = null, session = window.cubiSession || null;
let pendingSprint = false, selectedCategory = null, pendingTime = null, editTime = null, briefPoll = null, briefLate = null, briefLateClosed = false, briefLateText = "";
const shownHints = [];         // one-time notes from the plugin: kept while this page lives, until closed
const weekday = d => d ? "日一二三四五六"[new Date(d + "T00:00").getDay()] : "";
let confirmRemove = null, confirmDelete = null, confirmReassign = false;   // 移出這一期 / deleting a shared stretch, waiting for a yes
const openHours = new Set();   // tickets (and "*", the whole sprint) whose hours are shown by kind

// One message at a time, bottom right; the next one replaces it. Errors, and messages to `keep`,
// stay until closed (✕) or replaced; anything else goes after 4 seconds. `detail`: lines under a
// 明細 that opens by hand.
let statusTimer = null;
function status(msg, isError, { detail = [], keep = false } = {}) {
  const el = $("#status"), more = $("#status-detail");
  clearTimeout(statusTimer);
  $("#status-text").textContent = msg || "";
  $("#status-lines").replaceChildren(...detail.map(t => Object.assign(document.createElement("div"), { textContent: t })));
  more.hidden = !detail.length; more.open = false;
  el.hidden = !msg;
  el.classList.toggle("err", Boolean(isError));
  $("#status-close").hidden = !isError && !keep;
  if (msg && !isError && !keep) statusTimer = setTimeout(() => status(""), 4000);
}
const statusShows = msg => !$("#status").hidden && $("#status-text").textContent === msg;
$("#status-close").innerHTML = ic("x", 14) || "✕";
$("#status-close").addEventListener("click", () => {
  if (briefLateText && statusShows(briefLateText)) briefLateClosed = true;
  if (aiLateText && statusShows(aiLateText)) aiLateClosed = true;
  status("");
});
const bridge = () => window.webkit.messageHandlers.cubi;

// `quiet`: a look the user did not ask for (the brief poll) says nothing unless it fails, so what is
// on screen stays.
async function call(action, payload = {}, quiet = false) {
  if (session && !("session" in payload)) payload.session = session;
  if (!quiet) status("…");
  const r = await bridge().postMessage({ action, args: [JSON.stringify(payload)] });
  if (!r.ok) { status(r.err || "失敗", true); throw new Error(r.err || "failed"); }
  if (action === "review.export") { status("已匯出 " + r.out); return r.out; }
  const data = JSON.parse(r.out);
  if (data.error) { status(data.error, true); throw new Error(data.error); }
  if (!quiet) status("");
  return data;
}
// Never rejects: a failure is already on screen (status); the result says whether it worked.
// `sent`: the fields this call saves. On success their drafts go, unless typed over meanwhile.
// Actions run side by side, so replies can come back out of order. A plain read older than a reply
// already drawn is dropped; a write's reply always shows, since it carries what the write did.
// A failed send puts what was sent back as drafts (same sprint and session only), so a form that a
// re-render dropped can refill.
let asked = 0, drawn = 0;
async function refresh(action = "panel.state", payload = {}, sent = [], quiet = false) {
  sent = [...sent].map(draftOf).filter(Boolean);
  const n = ++asked, from = draftsFor;
  let data;
  try { data = await call(action, payload, quiet); } catch (_) {
    if (draftsFor === from) for (const [sel, d] of sent) if (!drafts.has(sel)) drafts.set(sel, d);
    return false;
  }
  if (action === "panel.state" && n < drawn) return true;
  drawn = Math.max(drawn, n);
  for (const [sel, d] of sent) if (drafts.get(sel)?.value === d.value) drafts.delete(sel);
  state = data;
  render(quiet);
  return true;
}
const link = key => `<a href="https://${esc(state.site)}/browse/${esc(key)}" title="在 Jira 開">${esc(key)}</a>`;
const tip = text => `<span class="cubi-tip" title="${esc(text)}">${ic("info", 13)}</span>`;

// ---------- render ----------
// What the user typed and has not saved lives in `drafts` (by field selector), noted as they type;
// a re-render draws the data and puts the drafts back on top. Drafts belong to one sprint and
// session, except the settings, which are global, and the field being typed in: that one is
// `carried` into the new sprint or session and never saved by itself until typed in again. The
// ＋時數 form keeps its own (pendingTime).
const fieldSel = a => a.id ? "#" + CSS.escape(a.id)
  : Object.keys(a.dataset).length ? `[data-${Object.keys(a.dataset)[0].replace(/[A-Z]/g, c => "-" + c.toLowerCase())}="${CSS.escape(Object.values(a.dataset)[0])}"]` : null;
const isBox = f => f.type === "checkbox";
const fieldValue = f => isBox(f) ? f.checked : f.value;
const isField = f => f?.matches?.("input, textarea, select");
const drafts = new Map(), carried = new Set();
let draftsFor = null, composing = false, renderLater = false;
function draftOf(f) {
  const sel = isField(f) && !f.closest("[data-time-form]") && fieldSel(f);
  return sel ? [sel, { value: fieldValue(f), global: !!f.closest("#tab-settings") }] : null;
}
function noteDraft(e) {
  const d = !e.isComposing && draftOf(e.target);
  if (d) { drafts.set(...d); carried.delete(d[0]); }
}
document.addEventListener("input", noteDraft);
document.addEventListener("change", noteDraft);
// Rebuilding the field mid-IME (注音 not yet turned into characters) would cut the composition off:
// a re-render waits for it to end.
// Leaving the field or the window ends it too, in case the IME never says so.
function endComposing() { composing = false; if (renderLater) render(); }
document.addEventListener("compositionstart", () => { composing = true; });
document.addEventListener("compositionend", e => { noteDraft(e); endComposing(); });
// After the event, so a compositionend still on its way lands first and focus has settled.
const endComposingSoon = () => setTimeout(() => { if (composing) endComposing(); });
document.addEventListener("focusout", endComposingSoon);
window.addEventListener("blur", endComposingSoon);
// A field that saves on change and got its draft back from a re-render: the browser takes the draft
// as the value it had on focus, so leaving it fires no change. Send it on the way out instead.
const restored = new WeakSet();
const unlikeMarkup = f => isBox(f) ? f.checked !== f.defaultChecked
  : f.tagName === "SELECT" ? f.selectedIndex !== Math.max(0, [...f.options].findIndex(o => o.defaultSelected)) : f.value !== f.defaultValue;
document.addEventListener("change", e => restored.delete(e.target), true);
document.addEventListener("focusout", e => {
  if (restored.delete(e.target) && unlikeMarkup(e.target)) e.target.dispatchEvent(new Event("change"));
});

// A form inside the tickets table keeps to the part of the scroller that shows (the table is wider
// than a narrow panel and scrolls sideways). Measured here, not a CSS container query: a
// `container-type` on the scroller made the page jump to the top on every redraw (batch 27).
let compactTickets = false;
// The tickets table: the full layout from the width its fixed columns, the status column and a 160px
// summary need (so the switch moves with the status names); below that the compact one. Neither
// changes the scroller's width, so it does not flip back and forth at the edge. Measured after a
// redraw (not a CSS container query, which made the page jump: batch 27).
const SUMMARY_MIN = 160;
function actionsWidth() { return 152 + (state.config.actualPointsField ? 34 : 0) + (state.config.actualHoursField ? 34 : 0); }
function fullFrom() { return 36 + 112 + 68 + 150 + 128 + actionsWidth() + statusWidth(state.sprint?.tickets || []) + SUMMARY_MIN; }
// The side menu goes to icons when the full one (282px around the table, 146 with icons) would push
// the table into its compact layout.
const NAV_ROOM = 282;
function fitNav() {
  const app = document.querySelector(".cubi-app");
  app.classList.toggle("nav-mini", app.clientWidth < (state ? fullFrom() : 860) + NAV_ROOM);
}
function fitTickets() {
  const sx = document.querySelector("#tab-overview .scroll-x"), table = sx?.querySelector("table.tickets");
  // A hidden tab measures 0: deciding then left the table compact on a wide panel (batch 34).
  if (!table || !sx.clientWidth) return;
  const want = sx.clientWidth < fullFrom();
  if (want !== compactTickets) { compactTickets = want; return render(true); }
  if (!compactTickets) return;
  // Compact does not scroll sideways on a 700px panel (batch 27): the status column takes what the
  // other columns (340px) and the longest key (at least 100px) leave, down to six characters and …
  const key = Math.max(100, ...[...table.querySelectorAll("tbody .key")].map(k => k.scrollWidth + 20));
  const st = Math.max(Math.min(compactStatus(), sx.clientWidth - 340 - key), Math.min(compactStatus(), statusText(["一二三四五六…"]) + 8));
  table.querySelectorAll("col")[3].style.width = `${st}px`;
  table.style.minWidth = `${340 + key + st}px`;
}
function fitForms() {
  for (const f of document.querySelectorAll(".scroll-x [data-time-form]")) {
    const w = f.closest(".scroll-x").clientWidth;
    if (w) f.style.maxWidth = `${w - 24}px`;
  }
}
// Measured again whenever the panel or the tickets tab changes width (a tab shown again goes from 0),
// not on window resize events alone.
let fittedTo = "";
const fitObserver = new ResizeObserver(() => {
  const to = `${document.querySelector(".cubi-app").clientWidth}|${document.querySelector("#tab-overview").clientWidth}`;
  if (to === fittedTo) return;
  fittedTo = to; fitNav(); fitForms(); fitTickets();
});
// The status column fits the longest status name of the tickets: 72–160px, in the compact layout
// at most 120px (its cell padding is 4px there). A longer name ends in … and the cell's title has it all.
let measure;
function statusText(names) {
  measure ||= document.createElement("canvas").getContext("2d");
  measure.font = `600 11.5px ${getComputedStyle(document.body).fontFamily}`;   // .cubi-pill
  return Math.ceil(Math.max(0, ...names.map(n => measure.measureText(n).width))) + 18 + 2;   // pill padding, rounding
}
const statusNames = tickets => tickets.map(t => t.notFound ? "Jira 查不到" : t.status || "–");
function statusWidth(tickets) { return Math.min(160, Math.max(72, statusText(statusNames(tickets)) + 20)); }
function compactStatus() { return Math.min(120, Math.max(72, statusText(statusNames(state.sprint?.tickets || [])) + 8)); }
function render(quiet = false) {
  if (composing) { renderLater = true; return; }
  renderLater = false;
  keepTimeForm();
  keepEditForm();
  const a = document.activeElement, ident = `${state.current}|${state.session?.id ?? ""}`;
  const focus = isField(a) ? fieldSel(a) : null, pos = a?.selectionStart ?? null;
  const moved = ident !== draftsFor;
  if (moved) {
    for (const [sel, d] of drafts) if (!d.global && sel !== focus) drafts.delete(sel);
    carried.clear();
    if (focus && drafts.has(focus) && !drafts.get(focus).global) carried.add(focus);
    draftsFor = ident;
  }
  const open = [...document.querySelectorAll("details[id][open]")].map(d => d.id);
  renderOverview(); renderReview(); renderSettings();
  for (const id of open) document.getElementById(id)?.setAttribute("open", "");
  fitNav();
  fitForms();
  fitTickets();
  if (!quiet && state.warnings && state.warnings.length) status(state.warnings.join("；"), true);
  else if (!quiet && state.notices && state.notices.length) status(state.notices.join("；"), true);
  for (const [sel, d] of drafts) {
    const el = document.querySelector(sel);
    if (!el || fieldValue(el) === d.value) { drafts.delete(sel); carried.delete(sel); continue; }
    if (isBox(el)) el.checked = d.value; else el.value = d.value;
    if (sel !== focus) continue;
    if (!carried.has(sel)) restored.add(el);
    else if (moved) status("這格是在上一個 sprint／session 打的，還沒存", true);
  }
  const el = focus && document.querySelector(focus);
  if (el) { el.focus(); if (pos !== null) el.setSelectionRange(pos, pos); }
}

// Clicking a heading sorts by it, again reverses; ★ first puts the starred ones on top.
let sortBy = null, sortDir = 1;
function sortTh(key, label, cls = "") {
  const mark = sortBy === key ? (sortDir > 0 ? " ▲" : " ▼") : "";
  return `<th class="${cls}" data-sort="${key}" title="點一下排序">${label}${mark}</th>`;
}
function sortedTickets(list) {
  const val = t => sortBy === "starred" ? (t.starred ? 0 : 1) : t[sortBy];
  const cmp = (a, b) => {
    if (!sortBy) return 0;
    const x = val(a), y = val(b);
    if (x == null || y == null) return x == null && y == null ? 0 : x == null ? 1 : -1;   // empty last, either way
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), "zh-Hant", { numeric: true })) * sortDir;
  };
  return list.map((t, i) => [t, i]).sort(([a, i], [b, j]) => cmp(a, b) || i - j).map(([t]) => t);
}

// Points still to do against the room left: a workday holds 8 h ÷ hours-per-point points.
function pendingKpi(c, hpp) {
  const over = c.roomLeft != null && c.pending > c.roomLeft;
  const value = `<span style="color:var(--cubi-${over ? "danger" : "ink"})">${pts(c.pending)}</span>`;
  const sub = c.roomLeft == null ? "填起訖日期才能比容量"
    : `剩 ${c.workdaysLeft} 個工作日（${pts(c.roomLeft)} 點）` + (c.unestimated ? ` · ${c.unestimated} 張未估點` : "");
  const warn = c.room != null && c.planned > c.room ? `<span class="cubi-pill danger" title="假日不扣；1 個工作日 = 8 小時 = ${pts(8 / hpp)} 點">排了 ${pts(c.planned)} / 容量 ${pts(c.room)} 點</span>` : "";
  return kpi("待處理點數", "hourglass", value, sub + warn, null);
}

function kpi(title, icon, value, sub, delta) {
  const d = delta == null ? "" : `<span class="cubi-delta ${delta > 0 ? "up" : delta < 0 ? "down" : "flat"}">${delta > 0 ? "▲" : delta < 0 ? "▼" : "＝"} ${esc(Math.abs(delta))}</span>`;
  return `<div class="cubi-kpi"><div class="cubi-kpi-head">${esc(title)}${ic(icon)}</div><div class="cubi-kpi-value"><b>${value}</b>${d}</div><div class="cubi-kpi-sub">${sub}</div></div>`;
}

function header(title) {
  const s = state.sprint;
  const options = state.sprints.map(x => `<option value="${esc(x.label)}" ${x.label === state.current ? "selected" : ""}>${esc(x.name || x.label)}${x.waiting ? "（尚未開始）" : ""}</option>`).join("");
  const pre = pendingSprint || {}, next = state.nextSprint;
  const days = s && s.reviewDay ? ` title="review ${esc(s.reviewDay)}（${weekday(s.reviewDay)}）、planning ${esc(s.planningDay)}（${weekday(s.planningDay)}）"` : "";
  return `<div class="cubi-header"><h1 class="cubi-title">${esc(title)}</h1>
      ${s ? `<span class="cubi-pill"${days}>${ic("clock", 13)}${esc(s.start || "?")} – ${esc(s.end || "?")}</span>` : ""}
      <span class="cubi-spacer"></span>
      ${state.sprints.length ? `<select id="sprint-select" title="切換 sprint">${options}</select>` : ""}
      ${next ? `<button class="cubi-btn" id="next-btn" title="預填下一期：${esc(next.start)} – ${esc(next.end)}（可以改）">${ic("plus")}建下一期</button>` : ""}
      <button class="cubi-btn" id="new-btn">${ic("plus")}新 sprint</button>
      ${s ? `<button class="cubi-btn primary" id="sp-sync" title="照設定的 JQL 從 Jira 抓這個 sprint 的單">${ic("refresh")}同步 Jira</button>` : ""}
    </div>${pendingSprint ? `<div class="cubi-card"><div class="cubi-form">
      <div class="cubi-field"><label>Jira 標籤 ${tip("要跟 Jira 上的標籤一模一樣，例如 Sprint7")}</label><input id="new-label" placeholder="Sprint7" value="${esc(pre.label || "")}"></div>
      <div class="cubi-field"><label>名稱</label><input id="new-name" placeholder="Sprint 7"></div>
      <div class="cubi-field"><label>開始</label><input id="new-start" type="date" value="${esc(pre.start || "")}"></div>
      <div class="cubi-field"><label>結束</label><input id="new-end" type="date" value="${esc(pre.end || "")}"></div>
      <div class="cubi-field" style="align-self:end"><div class="cubi-row"><button class="cubi-btn primary" id="new-save">建立</button><button class="cubi-btn" id="new-cancel">取消</button></div></div></div>
      <div class="cubi-muted" style="margin-top:10px">新的一期在 Jira 工單貼上這個標籤並「同步 Jira」之前是空的。開始日還沒到的話，面板會停在目前這期，到開始日自動切過去。${pre.start ? "日期是照兩週一期預填的，可以改。" : ""}</div></div>` : ""}`;
}

function bindHeader(el) {
  $("#sprint-select", el)?.addEventListener("change", async e => {
    if (await refresh("sprint.select", { label: e.target.value }, [e.target])) return;
    drafts.delete("#sprint-select");
    const sel = $("#sprint-select"); if (sel) sel.value = state.current;
  });
  // The form opens empty, or filled in with a proposal: the first sprint's dates (counted from the
  // anchor), or the sprint after the current one. Nothing is stored until 建立.
  const openForm = pre => { for (const id of ["#new-label", "#new-name", "#new-start", "#new-end"]) drafts.delete(id); pendingSprint = pre; render(); };
  $("#new-btn", el)?.addEventListener("click", () => openForm(pendingSprint ? false : (!state.sprint && state.period) || {}));
  $("#next-btn", el)?.addEventListener("click", () => openForm({ ...state.nextSprint }));
  $("#new-save", el)?.addEventListener("click", async () => {
    const pre = pendingSprint;
    pendingSprint = false;
    if (!await refresh("sprint.new", { label: $("#new-label").value.trim(), name: $("#new-name").value, start: $("#new-start").value, end: $("#new-end").value }, el.querySelectorAll("[id^=new-]"))) { pendingSprint = pre; render(); }
  });
  $("#new-cancel", el)?.addEventListener("click", () => { pendingSprint = false; render(); });
  $("#sp-sync", el)?.addEventListener("click", () => refresh("sprint.sync"));
}

function statusTone(t) { return t.done || t.statusCategory === "done" ? "good" : t.statusCategory === "indeterminate" ? "info" : ""; }
function remainTone(t) { if (t.remaining == null || !t.estimate) return ""; const left = t.remaining / (t.estimate * state.config.hoursPerPoint * 3600); return left > 0.5 ? "good" : left > 0.2 ? "warning" : "danger"; }
function prevSprint() { const h = state.history; const i = h.findIndex(x => x.label === state.current); return i > 0 ? h[i - 1] : null; }

function renderOverview() {
  const el = $("#tab-overview"), s = state.sprint;
  let html = header(s ? (s.name || s.label) : "Sprint");
  // Each is on screen from here on: tell the plugin, so it is not said again in a later panel.
  for (const h of state.hints || []) if (!shownHints.some(x => x.id === h.id)) {
    shownHints.push(h);
    bridge().postMessage({ action: "hint.seen", args: [JSON.stringify({ id: h.id })] }).catch(() => {});
  }
  html += shownHints.map(h => `<div class="cubi-card"><div class="cubi-row" style="flex-wrap:nowrap;align-items:flex-start">${ic("info")}<span style="flex:1;white-space:normal">${esc(h.text)}</span>
      <button class="cubi-btn icon" data-hint="${esc(h.id)}" title="知道了">${ic("x", 15)}</button></div></div>`).join("");
  if (s && s.reviewDue) html += reviewBanner(s);
  html += hoursPushNotice();
  if (state.timers.length) {
    html += `<div class="cubi-card"><div class="cubi-card-head">${ic("clock")}<h2 class="cubi-card-title">計時中</h2></div><table class="cubi-table tight"><tbody>` +
      state.timers.map(t => `<tr><td>${esc(t.name)}</td><td>${t.keys.length ? t.keys.map(link).join(" ") : t.item ? `<span class="cubi-pill">工作項目</span> ${esc(t.item)}` : `<span style="color:var(--cubi-warning)">單號和工作項目都解除了，停下來不會記</span>`}</td>
        <td class="num"><span class="timer" data-since="${t.start}">${clock(Date.now() / 1000 - t.start)}</span></td>
        <td class="num"><button class="cubi-btn small" data-stop="${esc(t.sid)}">${ic("pause", 13)}${t.keys.length || t.item ? "停止並記下" : "停止（不記）"}</button></td></tr>`).join("") + `</tbody></table></div>`;
  }
  if (state.session) html += sessionCard();
  if (!s) { el.innerHTML = html + `<div class="cubi-card cubi-muted">還沒有 sprint。按「新 sprint」，再「同步 Jira」。</div>`; bindOverview(el); return; }
  const m = s.metrics, prev = prevSprint(), hpp = state.config.hoursPerPoint;
  const rate = m.tickets ? Math.round(m.done / m.tickets * 100) : 0, stW = compactTickets ? compactStatus() : statusWidth(s.tickets);
  html += `<div class="cubi-kpis">
      ${kpi("完成點數", "check", `${pts(m.donePoints)}<span class="cubi-muted"> / ${pts(m.estimate)}</span>`, prev ? `上個 sprint ${pts(prev.donePoints)} 點` : "估點合計", prev ? Math.round((m.donePoints - prev.donePoints) * 10) / 10 : null)}
      ${kpi("完成率", "target", `${rate}%`, `${m.done} / ${m.tickets} 張`, null)}
      ${pendingKpi(s.capacity, hpp)}
      ${kpi("投入", "clock", hoursButton("*", m.seconds), (m.seconds - m.otherSeconds >= 60 ? `單上 ≈ ${pts((m.seconds - m.otherSeconds) / 3600 / hpp)} 點 · ` : "") + (m.ratio ? `實際 / 估點 ${m.ratio}` : "session＋手動") + (m.otherSeconds ? ` · 含無單 ${fmtH(m.otherSeconds)}` : ""), null)}
      ${kpi("會議", "users", fmtH(m.meetingSeconds), m.seconds ? `佔 ${Math.round(m.meetingSeconds / m.seconds * 100)}%` : "–", null)}
    </div>
    ${openHours.has("*") ? `<div class="cubi-card"><div class="cubi-card-head"><h2 class="cubi-card-title">投入明細</h2><span class="cubi-muted">${esc(hpp)} 小時 = 1 點</span></div>${kindsList(m.kinds, hpp)}</div>` : ""}
    <div class="cubi-grid">
      <div class="cubi-card"><div class="cubi-card-head"><h2 class="cubi-card-title">任務分類</h2><span class="cubi-spacer"></span>${tip("點一類看那些單")}</div>${categoryBlock(s)}</div>
      <div class="cubi-card"><div class="cubi-card-head"><h2 class="cubi-card-title">剩餘點數</h2><span class="cubi-spacer"></span><span class="cubi-muted">— 理想　● 實際</span></div><div class="chart">${burndownChart(s.burndown)}</div></div>
    </div>
    <div class="cubi-card" style="margin-top:16px"><div class="cubi-card-head"><h2 class="cubi-card-title">工單</h2><span class="cubi-muted">${m.tickets} 張</span><span class="cubi-spacer"></span>
      <button class="cubi-btn small ${aiPicking ? "on" : ""}" id="ai-multi" title="勾幾張單一起開 AI 估點（一次最多 ${AI_MAX} 張，每張都會跳一次確認）">${ic("sparkles", 13)}多張 AI 估點</button>
      <input id="add-key" placeholder="加單號" size="12"><button class="cubi-btn small" id="add-btn">${ic("plus", 13)}加</button></div>
    ${aiPicking ? aiPickBar() : ""}
    ${reassignBar(s.reassigned || [])}
    <div class="scroll-x"><table class="cubi-table fixed tickets${compactTickets ? " compact" : ""}" style="min-width:${compactTickets ? 440 + stW : 720}px">
    <colgroup>${compactTickets ? `<col style="width:28px"><col><col style="width:0"><col style="width:${stW}px"><col style="width:60px"><col style="width:70px"><col style="width:72px"><col style="width:110px">`
      : `<col style="width:36px"><col style="width:112px"><col><col style="width:${stW}px"><col style="width:68px"><col style="width:150px"><col style="width:128px"><col style="width:${actionsWidth()}px">`}</colgroup>
    <thead><tr>${sortTh("starred", "★")}${sortTh("key", compactTickets ? "單號／摘要" : "單號")}<th class="sum">摘要</th>${sortTh("status", "狀態")}${sortTh("estimate", "估", "num")}${sortTh("remaining", "剩餘")}${sortTh("seconds", "投入", "num")}<th></th></tr></thead><tbody>`;
  for (const t of sortedTickets(s.tickets)) {
    const rt = remainTone(t), budget = (t.estimate || 0) * hpp * 3600;
    const used = budget ? Math.min(100, Math.max(0, (budget - t.remaining) / budget * 100)) : 0;
    html += `<tr><td>${aiPicking ? aiPickBox(t) : `<button class="star ${t.starred ? "on" : ""}" data-star="${esc(t.key)}" title="${t.starred ? "取消重點" : "標成重點"}">${t.starred ? "★" : "☆"}</button>`}</td>
      <td class="clip"><span class="key"><span class="cubi-dot ${statusTone(t)}"></span>${link(t.key)}</span>${compactTickets ? `<div class="sum2" title="${esc(t.summary)}">${esc(t.summary)}</div>` : ""}${compactTickets ? ownerTag(t.owner) : ""}</td>
      <td class="clip sum" title="${esc(t.summary)}${t.notes ? "\n" + esc(t.notes) : ""}">${esc(t.summary)}${compactTickets ? "" : ownerTag(t.owner)}</td>
      <td class="st" title="${t.notFound ? "這張單在 Jira 被刪除，或你沒有查看權限。這裡是最後一次讀到的資料；不要它就按這列最右邊的 ✕ 移出這一期" : esc(t.status || "")}">${t.notFound
        ? `<span class="cubi-pill danger">Jira 查不到</span>` : `<span class="cubi-pill ${statusTone(t)}">${esc(t.status || "–")}</span>`}</td>
      <td class="num"><input class="est" data-est="${esc(t.key)}" value="${esc(t.estimate ?? "")}" inputmode="decimal" autocomplete="off" placeholder="–" ${t.notFound ? "disabled" : ""}
        title="${t.notFound ? "Jira 查不到這張單，不能寫估點" : t.estimateVia ? `這張單在 Jira 沒有估點欄位，估點${t.estimateVia === "comment" ? "記在 Cubi 發的【估點】留言" : "只記在這台電腦"}；改了會先在下面問你` : "估點。改了（按 Enter 或離開這一格）就寫回 Jira；清空代表未估點"}" style="width:52px;text-align:right"></td>
      <td>${t.remaining == null ? `<span class="cubi-muted">未估點</span>` : `<div class="remain"><div class="cubi-bar ${rt}"><i style="width:${used}%"></i></div><span style="color:var(--cubi-${rt || "ink2"})">${t.remaining < 0 ? "超 " + fmtH(-t.remaining) : fmtH(t.remaining)}</span></div>`}</td>
      <td class="num">${hoursButton(t.key, t.seconds, hpp)}${outsideOf(t.key).length ? `<button class="outside-tag ${openHours.has(t.key) ? "on" : ""}" data-hours="${esc(t.key)}" title="這張單有記在本期日期以外的時段；點一下在下面展開，可以改或刪">＋別期 ${outsideOf(t.key).length}</button>` : ""}</td>
      <td class="num actions"><span class="cubi-row acts">
        <button class="cubi-btn icon" data-time="${esc(t.key)}" title="補記時間（會議、討論）">${ic("plus", 15)}</button>
        <button class="cubi-btn icon" data-ai-est="${esc(t.key)}" title="${esc(aiEstimateOff(t) || "AI 估點：開一個 Claude Code 讀這張單與程式碼，給建議點數；你按「採用」才寫進 Jira")}" ${aiEstimateOff(t) ? "disabled" : ""}>${ic("sparkles", 15)}</button>
        <button class="cubi-btn icon" data-transition="${esc(t.key)}" title="${t.notFound ? "Jira 查不到這張單" : "換 Jira 狀態"}" ${t.notFound ? "disabled" : ""}>${ic("flag", 15)}</button>
        ${state.config.actualPointsField ? `<button class="cubi-btn icon" data-push="${esc(t.key)}" title="${t.notFound ? "Jira 查不到這張單" : "這張單所有投入（含之前的 sprint）換算的點數寫回 Jira"}" ${t.notFound ? "disabled" : ""}>${ic("download", 15)}</button>` : ""}
        ${state.config.actualHoursField ? `<button class="cubi-btn icon" data-push-hours="${esc(t.key)}" title="${t.notFound ? "Jira 查不到這張單" : "寫回時數：把這張單的總投入時數（含之前的 sprint）寫進 Jira 的實際時數欄位。會蓋掉那裡原有的數字，包含別人手動填的"}" ${t.notFound ? "disabled" : ""}>${ic("hourglass", 15)}</button>` : ""}
        <button class="cubi-btn icon" data-remove-ticket="${esc(t.key)}" title="移出這一期（會先問你）">${ic("minus", 15)}</button></span></td></tr>`;
    if (confirmRemove === t.key) html += `<tr class="ai-row"><td></td><td colspan="7"><div class="cubi-row ai-suggest">${ic("info", 14)}<span class="ai-reason">把 ${esc(t.key)} 移出這一期？工時紀錄不會刪；這張單在 Jira 還貼著本期標籤的話，下次同步會再加回來。</span><span class="cubi-spacer"></span>
      <button class="cubi-btn small primary" data-remove-yes="${esc(t.key)}">移出</button><button class="cubi-btn small" data-remove-no>取消</button></div></td></tr>`;
    if (t.suggestion || t.suggestPending) html += suggestionRow(t);
    if (t.commentAsk) html += commentRow(t);
    if (openHours.has(t.key)) html += `<tr><td colspan="8" style="white-space:normal">${kindsList(t.kinds, hpp)}${entriesList(t.entries, hpp, t.key)}${outsideList(t.key)}</td></tr>`;
    if (pendingTime && pendingTime.key === t.key) html += timeFormRow(t.key);
  }
  html += `</tbody></table></div></div>` + otherCard(s, hpp) + bindingsCard() + sprintInfoCard(s) + manualCard(s);
  el.innerHTML = html;
  bindOverview(el);
  const f = $(pendingTime?.fresh ? "#t-item" : "#t-hours", el); if (f && pendingTime && pendingTime.focus) { f.focus(); pendingTime.focus = false; }
}

// From the review day to the sprint's last day: write the review from here. The calendar event is
// handed to cubi once per sprint; 重新寫入 is for when it never showed up (calendar not allowed yet).
function reviewBanner(s) {
  const when = s.reviewDay === state.today ? "今天是 review 日" : `review 日是 ${esc(s.reviewDay)}（${weekday(s.reviewDay)}），這一期到 ${esc(s.end)}`;
  const ev = s.reviewEvent, time = t => new Date(t * 1000).toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  const calendar = !state.config.reviewEventStart ? `<span class="cubi-muted">沒有設定 review 事件時間，不寫行事曆</span>`
    : `<span class="cubi-muted">${ev ? `行事曆事件已送出（${esc(time(ev.start))}）` : "行事曆事件還沒送出"}</span>
       ${ev ? `<button class="cubi-btn small" id="review-resend" title="行事曆上沒看到事件時用：下一分鐘再寫一次。舊事件若被移動過，或 review 日、時段設定改過，行事曆上會多出一筆，請手動刪除舊的。">重新寫入行事曆</button>` : ""}`;
  return `<div class="cubi-card"><div class="cubi-row">${ic("review")}<b>${when}</b>${calendar}<span class="cubi-spacer"></span>
      <button class="cubi-btn primary" id="review-go" title="把這一期的數據交給 Claude Code 寫回顧（受限模式，會先問你）">${ic("sparkles")}產生回顧</button></div></div>`;
}

// Hours that still wait to be written to Jira on their own (tick writes a few each minute), and the
// ones Jira refused: those stay until 重試.
function hoursPushNotice() {
  const h = state.hoursPush || {}, waiting = (h.pending || []).length, stopped = (h.stopped || []).length;
  if (!waiting && !stopped) return "";
  return `<div class="cubi-card"><div class="cubi-row">${ic("hourglass")}<b>${waiting + stopped} 張時數尚未寫回</b>
      <span class="cubi-muted" style="white-space:normal">${waiting ? `${waiting} 張等下一分鐘自動寫` : ""}${waiting && stopped ? "，" : ""}${stopped ? `${stopped} 張被 Jira 拒絕、已停止重試（${h.stopped.map(esc).join("、")}）` : ""}${h.error ? `。最後一次錯誤：${esc(h.error)}` : ""}${h.on ? "" : "。自動寫回目前是關的，不會再寫"}</span>
      <span class="cubi-spacer"></span>${stopped ? `<button class="cubi-btn" id="hours-retry" title="讓被拒絕的那幾張再排進去，下一分鐘重寫一次">重試</button>` : ""}</div></div>`;
}

function sessionCard() {
  const b = state.session;
  return `<div class="cubi-card"><div class="cubi-card-head">${ic("link")}<h2 class="cubi-card-title">這個 session</h2><span class="cubi-muted">${esc(b.name)}</span><span class="cubi-spacer"></span>
      ${b.keys.length > 1 ? `<button class="cubi-btn small" id="shares-btn" title="把目前比例套到本 sprint 已記錄的時段">套用比例到本 sprint</button>` : ""}</div>
    ${b.item ? `<table class="cubi-table tight"><tbody><tr><td><span class="cubi-pill">工作項目</span> ${esc(b.item)}</td><td class="cubi-muted">${b.itemCounted ? "算進" : "不算進"} sprint 投入（在「沒有單號的工作」改）</td>
        <td class="num"><button class="cubi-btn icon" data-unbind="${esc(b.item)}" title="解除工作項目（已記的時間留著）">${ic("x", 14)}</button></td></tr></tbody></table>`
      : b.keys.length ? `<table class="cubi-table tight"><tbody>` + b.keys.map(k => { const t = (state.sprint?.tickets || []).find(x => x.key === k) || {};
      return `<tr><td>${link(k)}</td><td class="clip">${esc(t.summary || "")}</td><td class="num"><input type="number" min="0" max="100" value="${b.shares[k] ?? ""}" data-share="${esc(k)}" style="width:64px" title="時數分給這張單的比例"> %</td>
        <td class="num"><button class="cubi-btn icon" data-unbind="${esc(k)}" title="解除">${ic("x", 14)}</button></td></tr>`; }).join("") + `</tbody></table>` : `<div class="cubi-muted">還沒綁單號或工作項目。</div>`}
    <div class="cubi-row" style="margin-top:10px"><input id="bind-key" placeholder="單號（可多個）或工作項目名稱" size="24"><button class="cubi-btn small" id="bind-btn">${ic("plus", 13)}綁定</button>
      <span class="cubi-muted">${b.item ? "綁了工作項目，名稱與分支裡的單號先不自動綁" : `自動抓到：${esc(b.auto.join(" ") || "沒有")}`}</span>${tip("名稱、分支、目錄（" + (b.cwd || "?") + "）裡的單號會自動綁；多張單時數預設平分。填的不是單號，就是自己取的工作項目（例如「小工具開發」）。單號和工作項目只能二選一")}</div></div>`;
}

// Every session's bound tickets, to unbind from any of them (the island card lists eight).
function bindingsCard() {
  const list = state.bindings || [];
  if (!list.length) return "";
  return `<details class="cubi-card" id="bindings-overview"><summary class="cubi-card-title" style="cursor:pointer">綁定總覽 ${list.length} 個 session</summary>
    <table class="cubi-table tight" style="margin-top:8px"><tbody>${list.map(b => `<tr><td class="clip" style="width:220px;max-width:220px" title="${esc(b.name)}">${esc(b.name)}</td>
      <td style="white-space:normal">${b.item ? `<span class="cubi-row" style="display:inline-flex;gap:2px;margin:2px 10px 2px 0"><span class="cubi-pill">工作項目</span> ${esc(b.item)}
        <button class="cubi-btn icon" data-unbind-sid="${esc(b.sid)}" data-unbind-key="${esc(b.item)}" title="從這個 session 解除工作項目 ${esc(b.item)}">${ic("x", 12)}</button></span>` : ""}${b.keys.map(k => `<span class="cubi-row" style="display:inline-flex;gap:2px;margin:2px 10px 2px 0">${link(k)}${b.keys.length > 1 ? ` <small class="cubi-muted">${Math.round(b.shares[k] ?? 0)}%</small>` : ""}
        <button class="cubi-btn icon" data-unbind-sid="${esc(b.sid)}" data-unbind-key="${esc(k)}" title="從這個 session 解除 ${esc(k)}">${ic("x", 12)}</button></span>`).join("")}</td></tr>`).join("")}</tbody></table></details>`;
}

function sprintInfoCard(s) {
  const p = !s.start && !s.end && state.period;   // dates counted from the anchor: shown, stored only by 儲存
  return `<details class="cubi-card" id="sprint-info"${p ? " open" : ""}><summary class="cubi-card-title" style="cursor:pointer">Sprint 資訊</summary>
    ${p ? `<div class="cubi-muted" style="margin-top:10px">這一期還沒有日期。已照兩週一期預填 ${esc(p.start)} – ${esc(p.end)}，按「儲存」才生效。</div>` : ""}<div class="cubi-form" style="margin-top:12px">
      <div class="cubi-field"><label>名稱</label><input id="sp-name" value="${esc(s.name || "")}"></div>
      <div class="cubi-field"><label>開始</label><input id="sp-start" type="date" value="${esc(s.start || (p && p.start) || "")}"></div>
      <div class="cubi-field"><label>結束</label><input id="sp-end" type="date" value="${esc(s.end || (p && p.end) || "")}"></div>
      <div class="cubi-field" style="grid-column: span 2"><label>目標</label><input id="sp-goal" value="${esc(s.goal || "")}"></div>
      <div class="cubi-field" style="align-self:end"><div class="cubi-row"><button class="cubi-btn primary" id="sp-save">儲存</button>
        <button class="cubi-btn" id="sp-resync" title="sprint 變成跟 Jira 查詢結果一模一樣，拿掉不在結果裡的單">重抓並清掉</button></div></div></div></details>`;
}

// Hours with their points (hours ÷ hours-per-point); a click shows them by kind.
const asPts = (secs, hpp) => secs >= 60 && hpp ? ` <small>· ${pts(secs / 3600 / hpp)} 點</small>` : "";
function hoursButton(key, secs, hpp = null) {
  if (!secs || secs < 60) return "–";
  return `<button class="hours-btn ${openHours.has(key) ? "on" : ""}" data-hours="${esc(key)}" title="點一下看各類工時">${fmtH(secs)}${asPts(secs, hpp)}</button>`;
}
function kindsList(kinds, hpp) {
  const list = Object.entries(kinds || {}).filter(([, v]) => v >= 60).sort((a, b) => b[1] - a[1]);
  return list.length ? `<div class="kinds">${list.map(([k, v]) => `<span><b>${esc(k)}</b>${fmtH(v)}${asPts(v, hpp)}</span>`).join("")}</div>` : `<span class="cubi-muted">沒有工時</span>`;
}

// The ticket's hand-added stretches in this sprint, newest first, with what each adds to the totals
// above (this ticket's share, the sprint's part, minus minutes its session already counted).
const OVERLAP_TIP = "這張單同一段時間已經有其他紀錄，只算一次（這版之後新增的紀錄才這樣算）";
// A ticket's own manual stretches, each with 改 and ✕ (where she looks for them, next to the hours).
function entriesList(entries, hpp, key) {
  if (!entries.length) return "";
  return `<table class="cubi-table tight entries"><tbody>${entries.map(x => `<tr><td>${new Date(x.start * 1000).toLocaleString("zh-TW", { dateStyle: "short", timeStyle: "short" })}</td>
      <td><span class="cubi-pill">${esc(x.kind)}</span></td>
      <td class="num">${entryTime(x, hpp)}${x.pct < 100 ? ` <small class="cubi-muted">（${Math.round(x.pct)}%）</small>` : ""}</td>
      <td class="note">${esc(x.note) || `<span class="cubi-muted">沒寫備註</span>`}</td>
      <td class="num"><span class="cubi-row" style="justify-content:flex-end;flex-wrap:nowrap">${editButton(x, `entries:${key}`)}${removeButton(x, key, x.pct < 100)}</span></td></tr>${editRow(x, 5, `entries:${key}`)}${removeConfirm(x, key, 5)}`).join("")}</tbody></table>`;
}
// A ticket's manual stretches whose days are not this sprint's (written while another sprint was on
// screen, or "ended just now" in the next one): not counted here, still the ticket's, so listed
// under its hours with 改 and ✕, saying where they fall.
const outsideOf = key => (state.sprint?.manual || []).filter(m => Object.keys(m.shares || { [m.key]: 100 }).includes(key) && m.sprintOf !== state.sprint.label);
const fallsIn = m => m.sprintOf ? `落在 ${esc(m.sprintOf)}` : "不在任何一期";
function outsideList(key) {
  const xs = outsideOf(key);
  if (!xs.length) return "";
  return `<div class="cubi-muted" style="margin:10px 0 4px">不在本期期間的紀錄（${xs.length} 筆），不算進本期：</div><table class="cubi-table tight entries outside"><tbody>${xs.map(x => {
    const shared = Object.keys(x.shares || {}).length > 1, where = `outside:${key}`;
    return `<tr><td>${new Date(x.start * 1000).toLocaleString("zh-TW", { dateStyle: "short", timeStyle: "short" })}</td>
      <td><span class="cubi-pill">${esc(x.kind)}</span></td>
      <td class="num">${fmtH(x.end - x.start)} <small class="cubi-muted">${fallsIn(x)}</small></td>
      <td class="note">${esc(x.note || x.reason || "") || `<span class="cubi-muted">沒寫備註</span>`}</td>
      <td class="num"><span class="cubi-row" style="justify-content:flex-end;flex-wrap:nowrap">${editButton(x, where)}${removeButton(x, key, shared)}</span></td></tr>${editRow(x, 5, where)}${removeConfirm(x, key, 5)}`; }).join("")}</tbody></table>`;
}
// ✕ for a stretch under a ticket: a shared one (split over tickets) goes whole, so it asks first.
function removeButton(x, key, shared) {
  return shared ? `<button class="cubi-btn icon" data-remove-shared="${esc(`${key}:${x.id}`)}" title="刪除整段：這段分給了好幾張單，每張單的時數都會一起少（會先問你）">${ic("x", 14)}</button>`
    : `<button class="cubi-btn icon" data-remove-time="${esc(x.id)}" title="刪除這筆">${ic("x", 14)}</button>`;
}
function removeConfirm(x, key, columns) {
  if (confirmDelete !== `${key}:${x.id}`) return "";
  return `<tr><td colspan="${columns}" style="white-space:normal"><div class="cubi-row ai-suggest">${ic("info", 14)}<span class="ai-reason">確定刪除整段？這段分給了好幾張單，刪了每張單的時數都會一起少。</span><span class="cubi-spacer"></span>
    <button class="cubi-btn small primary" data-remove-time="${esc(x.id)}">刪除整段</button><button class="cubi-btn small" data-remove-shared-no>取消</button></div></td></tr>`;
}
// What one stretch adds, and what of it another record of the ticket already counts.
function entryTime(x, hpp) {
  const over = x.overlap || 0, tip = `title="${OVERLAP_TIP}"`;
  if (x.seconds >= 60) return fmtH(x.seconds) + asPts(x.seconds, hpp) + (over >= 60 ? ` <small class="cubi-muted" ${tip}>（另有 ${fmtH(over)} 跟其他紀錄重疊，不另算）</small>` : over > 0 ? ` <small class="cubi-muted" ${tip}>（重疊不到 1 分鐘，不另算）</small>` : "");
  if (x.session) return `<span class="cubi-muted" title="這段時間 session 已經記過，算在「Session」">已算在 Session</span>`;
  if (over > 0) return `<span class="cubi-muted" ${tip}>跟其他紀錄重疊 ${over >= 60 ? fmtH(over) : "不到 1 分鐘"}，不另算</span>`;
  return `<span class="cubi-muted">本 sprint 內不到 1 分鐘</span>`;
}

// What a record with no ticket is: its work item and what it says (a timer's says the item's name
// again), or, for one written before every record had an item, that it is under none.
const otherWhat = x => x.item ? `「${x.item}」${x.note && x.note !== x.item ? " " + x.note : ""}` : x.note;
const UNSORTED = `<span class="cubi-pill warning" title="改版前記的補記，沒有掛在任何工作項目底下；時數、計不計入與行事曆照舊。不要它可以按 ✕ 刪除">未歸屬（改版前記的）</span><br>`;
// Work with no ticket (a PM's incident meeting…): kept on the sprint; counted ones add to its hours.
function otherCard(s, hpp) {
  const form = pendingTime && pendingTime.fresh ? `<div style="margin-top:10px">${timeForm(pendingTime.key)}</div>` : "";
  const rows = s.other.map(x => `<tr><td>${new Date(x.start * 1000).toLocaleString("zh-TW", { dateStyle: "short", timeStyle: "short" })}</td><td class="num">${fmtH(x.end - x.start)}${asPts(x.end - x.start, hpp)}</td>
      <td class="clip" title="${esc(otherWhat(x))}"${x.item ? "" : ` style="white-space:normal"`}>${x.item ? "" : UNSORTED}<span class="cubi-pill">${esc(x.kind)}</span> ${esc(otherWhat(x))}</td>
      <td>${x.counted ? "" : `<span class="cubi-pill" title="不算進投入">不計入</span>`}${x.calendar ? ic("clock", 13) : ""}</td>
      <td class="num"><span class="cubi-row" style="justify-content:flex-end;flex-wrap:nowrap">${editButton(x, "other")}<button class="cubi-btn icon" data-remove-time="${esc(x.id)}" title="刪除">${ic("x", 14)}</button></span></td></tr>${editRow(x, 5, "other")}`).join("")
    + (s.itemWork || []).map(x => `<tr><td class="cubi-muted">本期自動記的</td><td class="num">${fmtH(x.seconds)}${asPts(x.seconds, hpp)}</td>
      <td class="clip" title="綁了工作項目「${esc(x.item)}」的 session 自己記的時間（扣掉補記與計時重疊的部分）"><span class="cubi-pill">自動</span> ${esc(x.item)}</td>
      <td>${x.counted ? "" : `<span class="cubi-pill" title="這個工作項目設成不算進投入（在下方「工作項目」改）">不計入</span>`}</td><td></td></tr>`).join("");
  return `<div class="cubi-card"><div class="cubi-card-head"><h2 class="cubi-card-title">沒有單號的工作</h2>${tip("會議、支援、面試…沒有 Jira 單但花了時間的事，都掛在一個工作項目底下（像一張沒有單號的單）：綁了它的 session 自動記的時間，加上它底下的補記。記在開始時間落在的那個 sprint（沒有就記在目前的）；算不算進上方投入看工作項目的設定，不算進任何一張單。要補記到已有的項目，按下方那一列的＋")}
      <span class="cubi-spacer"></span><button class="cubi-btn small" data-time="item:">${ic("plus", 13)}新工作項目</button></div>
    ${form}${rows ? `<div class="scroll-x"><table class="cubi-table tight fixed" style="min-width:470px"><colgroup><col style="width:150px"><col style="width:120px"><col><col style="width:84px"><col style="width:84px"></colgroup><tbody>${rows}</tbody></table></div>`
      : form ? "" : `<div class="cubi-muted">還沒有。</div>`}${itemsList(hpp)}</div>`;
}

// What switching 算進 sprint 投入 did: the item's whole sprint of now follows, earlier ones stay.
function itemChangedSaid(c) {
  if (!c.sprint) return `「${c.name}」${c.counted ? "之後記的會算進投入" : "之後記的不算進投入"}（還沒有任何一期）`;
  const what = c.seconds >= 60 ? `在 ${c.sprint} 的 ${fmtH(c.seconds)} ` : `（${c.sprint} 還沒記到時間）`;
  return `「${c.name}」${what}${c.counted ? "改成算進投入" : "改成不算進投入"}，之後記的也是；之前各期不變`;
}
// Work items: names of her own a session is bound to instead of tickets. Only on this machine.
function itemsList(hpp) {
  const items = state.items || [];
  if (!items.length) return "";
  return `<div class="cubi-row" style="margin-top:12px"><b>工作項目</b>${tip("按上方「新工作項目」，或在 session 的綁定框填一個名字（不是單號）就會建立。它的時間＝綁了它的 session 自動記的＋它底下的補記與計時；只存在這台電腦，不寫 Jira。session 自動記的不寫行事曆，補記可以勾「寫進行事曆」。「算進 sprint 投入」改了會套用到這個項目現在所在那一期（勾選下方寫的那一期，不一定是正在看的）的全部時間（自動記的、補記與計時）和之後記的，之前各期不變")}</div>
    <table class="cubi-table tight" style="margin-top:6px"><tbody>${items.map(it => `<tr><td class="clip" title="${esc(it.name)}">${esc(it.name)}</td>
      <td class="cubi-muted">${it.sessions ? `${it.sessions} 個 session 綁著` : "沒有 session 綁著"}</td><td class="num">本期 ${fmtH(it.seconds)}${asPts(it.seconds, hpp)}</td>
      <td class="num"><label class="cubi-row" style="justify-content:flex-end;gap:6px"><input type="checkbox" data-item-counted="${esc(it.name)}" ${it.counted ? "checked" : ""}> 算進 sprint 投入</label><div class="cubi-muted" style="font-size:11px">套用到 ${esc(state.nowSprint || state.current || "目前這一期")} 全部；之前各期不變</div></td>
      <td class="num"><span class="cubi-row" style="justify-content:flex-end;flex-wrap:nowrap"><button class="cubi-btn icon" data-time="item:${esc(it.name)}" title="補記時間到「${esc(it.name)}」（會議、討論…）">${ic("plus", 15)}</button><button class="cubi-btn icon" data-item-rename="${esc(it.name)}" title="改名（改成已有的名字就併在一起）" aria-label="改名">${PENCIL}</button><button class="cubi-btn icon" data-item-delete="${esc(it.name)}" title="刪除這個工作項目（會先說會一起刪掉什麼）" aria-label="刪除">${ic("x", 14)}</button></span></td></tr>${pendingTime && pendingTime.item === it.name
        ? `<tr><td colspan="5" style="white-space:normal;overflow:visible">${timeForm(pendingTime.key)}</td></tr>` : ""}${itemEdit && itemEdit.name === it.name ? `<tr><td colspan="5" style="white-space:normal;overflow:visible">${itemEditRow(itemEdit)}</td></tr>` : ""}`).join("")}</tbody></table>`;
}
// Renaming or deleting a work item: the row under it asks first; what cannot be undone (deleting,
// merging into another item) is said in full, and deleting takes a second press.
let itemEdit = null;   // {name, mode: "rename" | "delete", said, armed, to}
const hoursDiff = d => Math.abs(d) < 60 ? "不到 1 分鐘" : signed(d, fmtH);
const hoursChanged = c => c.length ? c.map(x => `${x.sprint} 投入 ${fmtH(x.before)} → ${fmtH(x.after)}（${hoursDiff(x.after - x.before)}）`).join("、") : "各期投入不變";
function itemDeleteLines(s) {
  return [s.records ? `底下 ${s.records} 筆補記一起刪掉（${s.bySprint.map(b => `${b.sprint || "不在任何一期"} ${b.records} 筆`).join("、")}，共 ${fmtH(s.recordSeconds)}）` : "底下沒有補記",
    s.autoSeconds > 0 ? `session 自動記到它的 ${s.autoSeconds >= 60 ? fmtH(s.autoSeconds) : "不到 1 分鐘"} 一起拿掉，不算進任何地方` : "",
    s.sessions ? `${s.sessions} 個 session 綁著它，會一起解除` : "",
    s.calendar ? `其中 ${s.calendar} 筆勾了寫進行事曆。${s.calendarLeft}` : "",
    hoursChanged(s.changes), s.changes.some(c => c.after > c.before) ? "投入會變多：這些補記原本扣掉了同一段時間 session 自動記的時間，刪了就還回去" : "",
    "刪之前會先備份資料檔；刪了在面板上復原不了"].filter(Boolean);
}
function itemEditRow(e) {
  const box = (text, buttons) => `<div class="cubi-row ai-suggest" style="align-items:flex-start">${ic("info", 14)}<span class="ai-reason">${text}</span><span class="cubi-spacer"></span>${buttons}<button class="cubi-btn small" id="item-edit-cancel">取消</button></div>`;
  if (e.mode === "delete")
    return box(`${e.said.inUse.length ? `<b style="color:var(--cubi-danger)">注意：${e.said.inUse.map(n => `「${esc(n)}」`).join("、")}這 10 分鐘內還在用「${esc(e.name)}」。刪掉後它之後的時間不會算進任何地方，要等它停 10 分鐘以上才恢復（即使你馬上把它改綁到單上）</b><br>` : ""}刪除「${esc(e.name)}」？${itemDeleteLines(e.said).map(l => `<br>・${esc(l)}`).join("")}`,
      `<button class="cubi-btn small primary" id="item-delete-yes">${e.armed ? "確定刪除？無法復原" : "刪除…"}</button>`);
  if (e.said) {
    const s = e.said;
    return box(esc(`「${s.name}」會併進已有的「${s.to}」，之後分不開：${[s.records ? `它底下 ${s.records} 筆補記` : "", s.sessions ? `${s.sessions} 個 session 的綁定` : "", s.autoSeconds > 0 ? "session 自動記到它的時間" : ""].filter(Boolean).join("、")}都搬過去${s.sprint ? `；${s.sprint} 裡併進來的時間改用「${s.to}」的設定（${s.counted ? "算進" : "不算進"}投入），之前各期照舊` : ""}；${hoursChanged(s.changes)}。合併前會先備份資料檔。`),
      `<button class="cubi-btn small primary" id="item-merge-yes">確定合併</button>`);
  }
  return `<div class="cubi-row"><input id="item-rename-to" maxlength="24" size="16" value="${esc(e.name)}" aria-label="新名字"><button class="cubi-btn small primary" id="item-rename-go">改名</button><button class="cubi-btn small" id="item-edit-cancel">取消</button>
    <span class="cubi-muted" style="font-size:11px">改成已有的名字（大小寫不同也算）就併在一起</span></div>`;
}
async function renameItem(confirm) {
  const f = $("#item-rename-to"), name = itemEdit.name, to = confirm ? itemEdit.to : f.value;
  if (!await refresh("item.rename", { name, to, confirm }, f ? [f] : [])) return;
  if (state.itemRename) { itemEdit = { ...itemEdit, said: state.itemRename, to }; render(); return; }
  const s = state.itemRenamed;
  itemEdit = null;
  render();
  if (s.merged) status(`「${s.name}」已併進「${s.to}」；${hoursChanged(s.changes)}`, false, { detail: [`合併前的資料備份在 ${s.backup}`], keep: true });
  else status(`「${s.name}」改名為「${s.to}」${s.calendar ? "；行事曆上已寫的事件標題不會跟著改" : ""}`, false, { keep: !!s.calendar });
}

function manualCard(s) {
  if (!s.manual.length) return "";
  return `<details class="cubi-card" id="manual-times"${editTime && editTime.where === "card" && s.manual.some(x => x.id === editTime.id) ? " open" : ""}><summary class="cubi-card-title" style="cursor:pointer">手動時段 ${s.manual.length} 筆</summary><table class="cubi-table tight" style="margin-top:8px"><tbody>` +
    s.manual.map(x => `<tr><td>${(Object.keys(x.shares || { [x.key]: 100 })).map(esc).join(" ")}</td><td>${new Date(x.start * 1000).toLocaleString("zh-TW")}</td><td class="num">${fmtH(x.end - x.start)}</td>
      <td><span class="cubi-pill">${esc(x.kind)}</span> ${esc(x.note || x.reason || "")}${x.sprintOf !== s.label ? ` <small class="cubi-muted">不在本期期間（${fallsIn(x)}），不算進本期</small>` : ""}</td><td>${x.calendar ? ic("clock", 13) : ""}</td>
      <td class="num"><span class="cubi-row" style="justify-content:flex-end;flex-wrap:nowrap">${editButton(x, "card")}<button class="cubi-btn icon" data-remove-time="${esc(x.id)}" title="刪除">${ic("x", 14)}</button></span></td></tr>${editRow(x, 6, "card")}`).join("") + `</tbody></table></details>`;
}

// The ＋時數 form sits right under its ticket's row and keeps what was typed across re-renders.
// Why a ticket's AI-estimate button is off, or "" while it is on.
// A ticket's code folder: its project's own, else the default (the plugin picks the same way).
const projectOf = key => String(key).split("-")[0];   // the plugin reads it the same way
const codeDirFor = key => { const d = state.config.estimateDirs; return (d && typeof d === "object" ? d : {})[projectOf(key)] || state.config.estimateSessionDir; };
// Jira has the ticket assigned to someone else, or to nobody (read at the last sync).
function ownerTag(o) {
  if (!o) return "";
  const text = o.kind === "none" ? "沒有負責人" : `已轉派給 ${o.name || "別人"}`;
  const why = o.kind === "none" ? "Jira 上這張單現在沒有負責人（上次同步讀到的）" : `Jira 上這張單現在的負責人是 ${o.name || "別人"}（上次同步讀到的）`;
  return `<div class="owner-tag" title="${esc(why)}">${esc(text)}</div>`;
}
// The open ones now someone else's, not yet answered: take them out on a yes, or let one be.
function reassignBar(list) {

const BRIEF_LATE_AFTER = 3 * 60 * 1000;
const BRIEF_LATE = "還沒收到回顧，請到終端看那個 session；它的指令被拒絕時，請它照資料檔的寫法重寫";
const estimateLate = key => `還沒收到 ${key} 的 AI 估點，請到終端看那個 session；它的指令被拒絕時，請它照資料檔的寫法重寫`;
const startBrief = () => openSession("review.brief", {}, () => JSON.stringify(state.sprint?.review), BRIEF_LATE, "Claude 寫回來了");
// Waiting: [null, true]; back: [suggestion, false]; gone (taken, dismissed, given up on): "null".
const aiSnapshot = key => { const t = state.sprint?.tickets.find(t => t.key === key); return JSON.stringify(t?.suggestion || t?.suggestPending ? [t.suggestion, t.suggestPending] : null); };
// AI estimates waited for, by ticket: each keeps its own last snapshot; one look every 30 seconds
// serves them all, and stops when none is left. A ticket leaves when its answer is gone (taken,
// dismissed, given up on) or after an hour. ✨ on one ticket and a batch of several go the same way.
const AI_MAX = 3;   // decided: no more than three at once
const aiWaits = new Map();
let aiPoll = null, aiLateText = "", aiLateClosed = false;
const aiLate = () => {
  // Not one given up on since the last look (不等了): its answer is "null" before the look drops it.
  const late = [...aiWaits].filter(([k, w]) => !w.got && Date.now() - w.started >= BRIEF_LATE_AFTER && aiSnapshot(k) !== "null").map(([k]) => k);
  return late.length === 1 ? estimateLate(late[0]) : late.length ? `還沒收到 ${late.join("、")} 的 AI 估點，請到終端看那些 session；指令被拒絕時，請它照資料檔的寫法重寫` : "";
};
function sayAiLate() {
  const text = aiLate();
  if (text && !aiLateClosed) { aiLateText = text; status(text, true); }
}
// Opens one restricted session for `key` and starts waiting for it. False when it was not opened
// (refused, cancelled): then nothing is left waiting for it.
// Opened, or why not ("" when the user cancelled cubi's confirmation): a batch says it at the end.
async function openEstimate(key) {
  let b;
  try { b = await call("estimate.brief", { key }); } catch (e) { return { ok: false, why: String(e.message || e) }; }
  status(`${key}：正在開 Claude Code…`);
  let r;
  try { r = await bridge().postMessage({ action: "session.new", args: [JSON.stringify({ directory: b.directory, prompt: b.prompt, restricted: true, readDirs: b.readDirs, allowActions: b.allowActions })] }); }
  catch (e) { r = { ok: false, err: String(e.message || e) }; }
  if (!r.ok) {
    // estimate.brief already marked it as asked: let it go, or ✨ would stay off for the hour.
    await refresh("estimate.dismiss", { key }, [], true);
    const why = r.cancelled ? "" : r.err || "開不了 session";
    status(why && `${key}：${why}`, !!why);
    return { ok: false, why };
  }
  await refresh("panel.state", {}, [], true);   // what the action itself changed is not the answer
  if (aiSnapshot(key) === "null") { status(`${key} 已按「不等了」，這個 session 寫回來也不會收`); return { ok: true }; }
  aiWaits.set(key, { before: aiSnapshot(key), got: false, started: Date.now() });
  aiLateClosed = false;
  // The session is never asked anything, so a write-back it got wrong is refused without a sign
  // here. Past three minutes, say where to look; a later look says it again when nothing else is
  // on screen, until the user closes it.
  setTimeout(() => { if (aiWaits.has(key) && !aiWaits.get(key).got) sayAiLate(); }, BRIEF_LATE_AFTER);
  if (!aiPoll) aiPoll = setInterval(lookForAi, 30000);
  status(`已在 ${b.directory} 開 ${key} 的 session；每 30 秒看一次，寫好就出現（資料檔 ${b.file}）`);
  return { ok: true };
}
async function lookForAi() {
  if (!await refresh("panel.state", {}, [], true)) return;
  const said = [];
  for (const [key, w] of aiWaits) {
    const now = aiSnapshot(key);
    if (now === "null") { aiWaits.delete(key); continue; }                 // taken, dismissed: quietly
    if (now !== w.before) { said.push(`${key} 的 AI 估點${w.got ? "更新了" : "回來了"}`); w.before = now; w.got = true; continue; }
    if (Date.now() - w.started > 3600 * 1000) aiWaits.delete(key);
  }
  if (!aiWaits.size) { clearInterval(aiPoll); aiPoll = null; }
  const waiting = [...aiWaits.values()].filter(w => !w.got).length;
  if (said.length) status(said.join("；") + (waiting ? `（還在等 ${waiting} 張）` : ""));
  else if ($("#status").hidden) sayAiLate();
}
const startEstimate = key => openEstimate(key);
// Choosing tickets for several at once: a box before each key; one that cannot be estimated now
// (no code folder, waiting already, not in Jira) cannot be ticked, and no more than AI_MAX may be
// asked for at once, counting those still waiting.
let aiPicking = false;
const aiPicked = new Set();
const aiRoom = () => AI_MAX - (state.sprint?.tickets || []).filter(t => t.suggestWaiting).length;
function aiPickBox(t) {
  const off = aiEstimateOff(t), full = !aiPicked.has(t.key) && aiPicked.size >= aiRoom();
  return `<input type="checkbox" class="ai-pick" data-ai-pick="${esc(t.key)}" ${aiPicked.has(t.key) ? "checked" : ""} ${off || full ? "disabled" : ""}
    title="${esc(off || (full ? `一次最多 ${AI_MAX} 張（包含還在等的）` : "勾起來一起估"))}">`;
}
function aiPickBar() {
  const room = aiRoom();
  return `<div class="cubi-row ai-suggest ai-pickbar">${ic("sparkles", 14)}<span class="ai-reason">${room > 0
      ? `勾要一起 AI 估點的單，最多 ${room} 張${room < AI_MAX ? `（另有 ${AI_MAX - room} 張還在等）` : ""}。每張都會跳一次 Cubi 的確認，取消一張就停在那裡。`
      : `已經有 ${AI_MAX} 張在等 AI 估點，等它們回來或按「不等了」再開新的。`}</span><span class="cubi-spacer"></span>
    <button class="cubi-btn small primary" id="ai-pick-go" ${aiPicked.size ? "" : "disabled"}>開始估（${aiPicked.size} 張）</button><button class="cubi-btn small" id="ai-pick-cancel">取消</button></div>`;
}
// Several at once: one after another, each with cubi's own confirmation; a cancel or a failure
// stops the rest, and the last word keeps why it failed.
async function startEstimates(keys) {
  let opened = 0, stop = null;
  for (const key of keys) {
    const r = await openEstimate(key);
    if (!r.ok) { stop = { key, why: r.why }; break; }
    opened++;
  }
  if (!stop) return;
  if (!stop.why) { status(`開了 ${opened} 張的 AI 估點，其餘 ${keys.length - opened} 張沒有開`, opened === 0); return; }
  const rest = keys.length - opened - 1;
  status((opened ? `開了 ${opened} 張的 AI 估點；` : "") + `${stop.key} 沒開成：${stop.why}` + (rest ? `；其餘 ${rest} 張沒有開` : ""), true);
}
// A restricted Claude Code session that hands its answer back to the panel: `action` writes its data
// file, cubi opens it, then the panel looks every 30 seconds until `snapshot` changes. With `again`,
// it keeps looking for a resend until the answer is gone (taken or dismissed: snapshot "null") or
// an hour has passed. One wait at a time: a new session replaces the wait for the last one.
async function openSession(action, payload, snapshot, late, done, again = "") {
  let b;
  try { b = await call(action, payload); } catch (_) { return; }
  status("正在開 Claude Code…");
  let r;
  try { r = await bridge().postMessage({ action: "session.new", args: [JSON.stringify({ directory: b.directory, prompt: b.prompt, restricted: true, readDirs: b.readDirs, allowActions: b.allowActions })] }); }
  catch (e) { status(String(e.message || e), true); return; }
  if (!r.ok) { status(r.cancelled ? "" : (r.err || "開不了 session"), !r.cancelled); return; }
  status(`已在 ${b.directory} 開 session；每 30 秒看一次，寫好就出現（資料檔 ${b.file}）`);
  await refresh("panel.state", {}, [], true);   // what the action itself changed is not the answer
  let before = snapshot(), got = false;
  const started = Date.now();
  clearInterval(briefPoll); clearTimeout(briefLate);
  briefLateClosed = false;
  briefLateText = late;
  // The session is never asked anything, so a write-back it got wrong (a `cd` put in front, a
  // quote left open) is refused without a sign on this side. Past three minutes, say where to look;
  // a later look says it again when nothing else is on screen, until the user closes it.
  briefLate = setTimeout(() => { if (!got && snapshot() === before && !briefLateClosed) status(late, true); }, BRIEF_LATE_AFTER);
  briefPoll = setInterval(async () => {
    if (!await refresh("panel.state", {}, [], true)) return;
    const now = snapshot(), gone = again && now === "null";
    if (now !== before) {
      if (!again || gone) clearInterval(briefPoll);
      if (!gone) status(got ? again : done);
      before = now; got = true; clearTimeout(briefLate);
    } else if (Date.now() - started > 3600 * 1000) { clearInterval(briefPoll); }
    else if (!got && Date.now() - started >= BRIEF_LATE_AFTER && !briefLateClosed && $("#status").hidden) status(late, true);
  }, 30000);
}

// ---------- charts: inline SVG; categories have fixed colours, text stays in ink ----------
const W = 440;
function donut(counts, cats) {
  const total = counts.reduce((a, b) => a + b, 0), R = 66, r = 44, cx = 75, cy = 75;
  if (!total) return `<svg viewBox="0 0 150 150"><circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="var(--cubi-line)" stroke-width="${R - r}"/></svg>`;
  let a0 = -Math.PI / 2, g = "";
  counts.forEach((n, i) => {
    if (!n) return;
    const dim = selectedCategory && selectedCategory !== cats[i] ? " dim" : "";
    if (n === total) { g += `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${CAT_COLORS[i]}" stroke-width="${R - r}" class="slice${dim}" data-cat="${esc(cats[i])}" style="cursor:pointer"><title>${esc(cats[i])} ${n} 張</title></circle>`; return; }
    const a1 = a0 + n / total * 2 * Math.PI, big = a1 - a0 > Math.PI ? 1 : 0, p = (a, rad) => `${cx + rad * Math.cos(a)},${cy + rad * Math.sin(a)}`;
    g += `<path class="slice${dim}" d="M ${p(a0, R)} A ${R} ${R} 0 ${big} 1 ${p(a1, R)} L ${p(a1, r)} A ${r} ${r} 0 ${big} 0 ${p(a0, r)} Z" fill="${CAT_COLORS[i]}" data-cat="${esc(cats[i])}"><title>${esc(cats[i])} ${n} 張</title></path>`;
    a0 = a1;
  });
  g += `<text x="${cx}" y="${cy + 2}" text-anchor="middle" style="font-size:22px;font-weight:700;fill:var(--cubi-ink)">${total}</text><text x="${cx}" y="${cy + 18}" text-anchor="middle">張</text>`;
  return `<svg viewBox="0 0 150 150">${g}</svg>`;
}
function burndownChart(b) {
  if (!b.length) return `<div class="cubi-muted">sprint 要有起訖日期（Sprint 資訊）。</div>`;
  const H = 170, left = 30, bottom = 22, top = 10, max = Math.max(1, b[0].ideal, ...b.map(p => p.actual || 0));
  const x = i => left + i / Math.max(1, b.length - 1) * (W - left - 10), y = v => top + (1 - v / max) * (H - top - bottom);
  const actual = b.map((p, i) => [p, i]).filter(([p]) => p.actual != null);
  const line = actual.map(([p, i]) => `${x(i)},${y(p.actual)}`).join(" ");
  const area = actual.length ? `${x(actual[0][1])},${y(0)} ${line} ${x(actual[actual.length - 1][1])},${y(0)}` : "";
  let g = `<defs><linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--cubi-accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--cubi-accent)" stop-opacity="0"/></linearGradient></defs>`;
  [0, 0.5, 1].forEach(f => { g += `<line x1="${left}" x2="${W - 10}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--cubi-line2)"/><text x="${left - 6}" y="${y(max * f) + 4}" text-anchor="end">${pts(max * f)}</text>`; });
  g += `<polyline points="${b.map((p, i) => `${x(i)},${y(p.ideal)}`).join(" ")}" fill="none" stroke="var(--cubi-ink3)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  if (area) g += `<polygon points="${area}" fill="url(#bd)"/><polyline points="${line}" fill="none" stroke="var(--cubi-accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  actual.forEach(([p, i]) => { g += `<circle cx="${x(i)}" cy="${y(p.actual)}" r="3" fill="var(--cubi-accent)"><title>${p.date} 剩 ${p.actual}</title></circle>`; });
  g += `<text x="${left}" y="${H - 4}">${b[0].date.slice(5)}</text><text x="${W - 10}" y="${H - 4}" text-anchor="end">${b[b.length - 1].date.slice(5)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function historyChart(hist) {
  if (hist.length < 2) return `<div class="cubi-muted">有兩個以上的 sprint 才有趨勢。</div>`;
  const H = 150, max = Math.max(1, ...hist.map(h => h.donePoints)), slot = (W - 20) / hist.length, bw = Math.min(46, slot - 16);
  let g = "";
  hist.forEach((h, i) => {
    const cx = 10 + i * slot + slot / 2, bh = Math.max(4, h.donePoints / max * 90), y = 108 - bh, on = h.label === state.current;
    g += `<rect x="${cx - bw / 2}" y="${18}" width="${bw}" height="90" rx="10" fill="var(--cubi-line2)"/>
      <rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${bh}" rx="10" fill="${on ? "var(--cubi-accent)" : "var(--cubi-ink3)"}" opacity="${on ? 1 : .45}"><title>${esc(h.label)} 完成 ${pts(h.donePoints)} 點</title></rect>
      <text x="${cx}" y="${y - 5}" text-anchor="middle" style="fill:var(--cubi-ink);font-weight:600">${pts(h.donePoints)}</text>
      <text x="${cx}" y="126" text-anchor="middle" style="${on ? "fill:var(--cubi-accent);font-weight:600" : ""}">${esc(h.label)}</text><text x="${cx}" y="142" text-anchor="middle">${h.ratio ?? "–"}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

// ---------- settings ----------
// The projects a code folder can be set for: the configured ones, those this sprint's tickets carry,
// and any already set.
function projectsForDirs() {
  const keys = String(state.config.projectKey || "").toUpperCase().split(/[,\s]+/).filter(Boolean);
  for (const t of state.sprint?.tickets || []) keys.push(projectOf(t.key));
  keys.push(...Object.keys(state.config.estimateDirs || {}));
  return [...new Set(keys)];
}
function renderSettings() {
  const el = $("#tab-settings"), c = state.config;
  const projects = String(c.projectKey ?? "").split(/[,\s]+/).filter(Boolean);
  const sent = String(c.jql ?? "").replace("{projects}", projects.join(", ")).replace("{project}", projects[0] || "").replace("{label}", state.current || "…");
  const field = (k, label, hint, type = "text") => `<div class="cubi-field"><label for="c-${k}">${label} ${hint ? tip(hint) : ""}</label><input id="c-${k}" type="${type}" value="${esc(c[k] ?? "")}"></div>`;
  el.innerHTML = `<div class="cubi-header"><h1 class="cubi-title">設定</h1><span class="cubi-spacer"></span><button class="cubi-btn primary" id="c-save">${ic("check")}儲存</button></div>
    <div class="cubi-card"><div class="cubi-section-title">Jira</div><div class="cubi-form">
      ${field("site", "站台", "例如 example.atlassian.net")}
      ${field("netrc", "帳密檔", `netrc 一行：machine <站台> login <email> password <API token>${state.netrcFound ? "" : "（現在找不到這個檔）"}`)}
      ${field("projectKey", "專案 key", "可多個，逗號分開")}
      ${field("pointsField", "估點欄位", "Story point estimate 通常是 customfield_10016")}
      ${field("actualPointsField", "實際點數欄位", "留空就只存本機；填了表格才有寫回")}
      ${field("actualHoursField", "實際時數欄位", "Jira 上放實際時數的數字欄位（customfield_…）。填了工單那列才有「寫回時數」；留空就不寫")}
      <div class="cubi-field"><label for="c-autoPushHours">自動寫回時數 ${tip("開了以後，停止計時、新增／修改／刪除手動時段時，那張單的總投入時數會在一分鐘內自己寫進上面那個欄位，蓋掉 Jira 原有的數字（別人手填的也會被蓋掉）。要先填實際時數欄位才有作用")}</label>
        <label class="cubi-row" style="gap:6px"><input id="c-autoPushHours" type="checkbox" ${c.autoPushHours ? "checked" : ""}> 開</label></div>
    </div>${state.netrcFound ? "" : `<div class="cubi-row" style="margin-top:10px"><span class="cubi-pill danger">找不到帳密檔</span></div>`}
    <div class="cubi-section-title">同步</div><div class="cubi-form">
      <div class="cubi-field" style="grid-column: 1 / -1"><label for="c-jql">JQL ${tip("本期會送出：" + sent)}</label><input id="c-jql" value="${esc(c.jql ?? "")}"></div>
      ${field("hoursPerPoint", "每點小時數", "實際點數＝投入時數 ÷ 這個數", "number")}
      ${field("cadenceAnchor", "節奏錨點", "某一期開始的那個週一。兩週一期從這天往後算，用來預填每期的起訖；留空就不預填", "date")}
      ${field("reviewEventStart", "review 事件時間", "每一期 review 日在行事曆上寫一筆「Sprint review」，從這個時間開始。留空就不寫。改了只影響還沒寫出事件的期", "time")}
      ${field("reviewEventMinutes", "review 事件長度（分）", "5 到 480 分鐘", "number")}
    </div>
    <div class="cubi-section-title">回顧</div><div class="cubi-form">
      ${field("reviewDir", "Markdown 資料夾", "匯出 <資料夾>/<標籤>.md；整理用的資料檔也在這")}
      ${field("reviewSessionDir", "整理用的 session 開在", "「用 Claude 整理」在這裡開 Claude Code")}
    </div>
    <div class="cubi-section-title">AI 估點</div><div class="cubi-form">
      ${field("estimateSessionDir", "預設的程式碼資料夾", "工單表每列的「AI 估點」在程式碼資料夾開 Claude Code，讀這張單和資料夾裡的程式碼，給建議點數。下面沒有指定資料夾的專案用這個；兩邊都留空，那個專案的單就不能用")}
      <div class="cubi-field" style="grid-column: 1 / -1"><label>各專案的程式碼資料夾 ${tip("依單號前面的專案代號（例如 WEB-123 的 WEB）選資料夾；留空就用上面的預設資料夾")}</label>
        ${projectsForDirs().map(k => `<div class="cubi-row dir-row"><span class="dir-key">${esc(k)}</span><input id="c-dir-${esc(k)}" data-dir-project="${esc(k)}" value="${esc((c.estimateDirs || {})[k] || "")}" placeholder="留空＝用預設資料夾"><button class="cubi-btn small" data-pick-dir="${esc(k)}">選資料夾</button></div>`).join("")}</div>
      <p class="dir-note">這個資料夾裡的檔案 Claude 都讀得到，請勿選含機密的資料夾（例如放了 .env、金鑰、憑證的資料夾）。建議值與理由只存在這台電腦；你按「採用」時只把點數寫進 Jira。</p>
      <div class="cubi-field" style="grid-column: 1 / -1"><label for="c-estimateRules">補充估點規則 ${tip("寫進給 Claude 的估點資料「怎麼估」那一節最後，例如「子單也算進來」「新增功能與修改分開看」。500 字內；留空就照預設方式估")}</label><textarea id="c-estimateRules" placeholder="一行一條，可留空">${esc(c.estimateRules ?? "")}</textarea></div>
    </div></div>`;
  el.querySelectorAll("[data-pick-dir]").forEach(b => b.addEventListener("click", async () => {
    const r = await bridge().postMessage({ action: "pick.dir" });
    if (r && r.ok && r.path) { const f = $(`#c-dir-${CSS.escape(b.dataset.pickDir)}`); f.value = r.path; f.dispatchEvent(new Event("input", { bubbles: true })); }
  }));
  $("#c-save", el).onclick = () => { const p = {}; ["site", "netrc", "projectKey", "jql", "pointsField", "actualPointsField", "actualHoursField", "hoursPerPoint", "cadenceAnchor", "reviewEventStart", "reviewEventMinutes", "reviewDir", "reviewSessionDir", "estimateSessionDir", "estimateRules"].forEach(k => { p[k] = $("#c-" + k).value; });
    p.estimateDirs = Object.fromEntries([...el.querySelectorAll("[data-dir-project]")].map(i => [i.dataset.dirProject, i.value])); p.autoPushHours = $("#c-autoPushHours").checked; refresh("config.set", p, el.querySelectorAll("[id^=c-]")); };
}

// ---------- boot ----------
// Switching tabs only shows and hides: every tab stays rendered, so nothing typed in one is lost.
function showTab(tab) {
  document.querySelectorAll(".cubi-nav-item").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  for (const k of Object.keys(TABS)) $("#tab-" + k).hidden = k !== tab;
  fitForms(); fitTickets();
}
$("#brand").innerHTML = ic("target", 18) + `<span class="nav-t">Sprint</span>`;
$("#brand").title = "Sprint";
document.querySelectorAll(".cubi-nav-item").forEach(b => { const [i, t] = TABS[b.dataset.tab]; b.innerHTML = ic(i) + `<span class="nav-t">${t}</span>`; b.title = t; b.addEventListener("click", () => showTab(b.dataset.tab)); });
fitNav();
for (const el of [$(".cubi-app"), $("#tab-overview")]) fitObserver.observe(el);
setInterval(() => state && state.timers.length && document.querySelectorAll(".timer[data-since]").forEach(t => { const secs = Date.now() / 1000 - Number(t.dataset.since); t.textContent = clock(secs); t.classList.toggle("long", secs > 8 * 3600); }), 1000);
window.addEventListener("cubisession", () => { session = window.cubiSession || null; refresh(); });
refresh();
</script>
